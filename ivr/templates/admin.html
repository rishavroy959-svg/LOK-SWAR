<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lok Swar — IVR Admin Console</title>
  <meta name="description" content="IVR Customer Care Admin Console" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              DEFAULT: '#087F5B',
              bg: '#E8F7F1',
              border: '#BFE8D8',
              hover: '#076D4E'
            },
            neutral: {
              main: '#17212B',
              sec: '#667085',
              muted: '#98A2B3',
              page: '#F7F9F8',
              card: '#FFFFFF',
              border: '#E4E7EC'
            },
            status: {
              red: '#DC2626',
              redbg: '#FEF2F2',
              redborder: '#FECACA',
              amber: '#D97706',
              amberbg: '#FFFBEB',
              amberborder: '#FDE68A',
              green: '#059669',
              greenbg: '#ECFDF5',
              greenborder: '#A7F3D0'
            }
          },
          boxShadow: {
            'soft': '0 1px 3px 0 rgba(0, 0, 0, 0.05)',
          }
        }
      }
    };
  </script>
  <style>
    body { background-color: #F7F9F8; color: #17212B; overflow: hidden; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }

    /* Custom audio player */
    audio { width: 100%; height: 36px; border-radius: 8px; outline: none; }
    audio::-webkit-media-controls-panel { background: #F7F9F8; border: 1px solid #E4E7EC; border-radius: 8px; }
    
    .list-item-active {
      border-color: #BFE8D8;
      background-color: #E8F7F1;
    }
    .list-item-active .item-indicator {
      background-color: #087F5B;
    }

    #toast { transition: opacity .2s ease, transform .2s ease; }
    #toast.hidden { opacity:0; transform:translateY(8px); pointer-events:none; }
  </style>
</head>
<body class="h-screen flex flex-col antialiased selection:bg-brand-bg selection:text-brand">

  <!-- TOP HEADER -->
  <header class="h-14 bg-white border-b border-neutral-border flex items-center justify-between px-4 sm:px-6 shrink-0 z-20">
    <!-- Left: Branding -->
    <div class="flex items-center gap-3">
      <div class="text-brand flex items-center justify-center">
        <i data-lucide="audio-lines" class="w-6 h-6"></i>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-semibold text-neutral-main text-base tracking-tight">Lok Swar</span>
        <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-neutral-page border border-neutral-border text-neutral-sec">Live Toll-Free</span>
      </div>
    </div>

    <!-- Center: Search -->
    <div class="flex-1 max-w-md hidden sm:block mx-4">
      <div class="relative group">
        <i data-lucide="search" class="w-4 h-4 text-neutral-muted absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input id="search-input" type="search" placeholder="Search phone number or ticket ID..."
          class="w-full bg-neutral-page border border-neutral-border rounded-lg pl-9 pr-3 py-1.5 text-sm text-neutral-main placeholder:text-neutral-muted focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-colors" />
      </div>
    </div>

    <!-- Right: Actions -->
    <div class="flex items-center gap-3">
      <div id="live-stream-badge" class="hidden md:flex items-center gap-1.5 text-xs font-medium text-neutral-sec">
        <div class="w-2 h-2 rounded-full bg-status-green"></div>
        Live
      </div>
      <div class="w-px h-4 bg-neutral-border mx-1"></div>
      <a href="/phone" target="_blank" class="flex items-center gap-1.5 text-xs font-medium text-neutral-sec hover:text-neutral-main transition-colors">
        <i data-lucide="smartphone" class="w-4 h-4"></i>
        Open Keypad
      </a>
      <button onclick="createMockTicket()" class="flex items-center gap-1.5 text-xs font-medium text-neutral-sec hover:text-neutral-main transition-colors ml-2">
        <i data-lucide="plus" class="w-4 h-4"></i>
        New Call
      </button>
      <button onclick="loadTickets()" class="flex items-center gap-1.5 text-xs font-medium text-neutral-sec hover:text-neutral-main transition-colors ml-2">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        Refresh
      </button>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- LEFT SIDEBAR: Navigation & Overview -->
    <aside class="w-[240px] bg-neutral-page border-r border-neutral-border flex-col hidden md:flex shrink-0 z-10 overflow-y-auto">
      <div class="p-4 space-y-6">
        
        <!-- Live Overview -->
        <div>
          <h3 class="text-[11px] font-semibold text-neutral-muted uppercase tracking-wider mb-3">Live Overview</h3>
          <div class="grid grid-cols-2 gap-2" id="stats-bar">
            <!-- Populated by JS -->
            <div class="bg-white border border-neutral-border rounded-lg p-3 animate-pulse"></div>
            <div class="bg-white border border-neutral-border rounded-lg p-3 animate-pulse"></div>
            <div class="bg-white border border-neutral-border rounded-lg p-3 animate-pulse"></div>
            <div class="bg-white border border-neutral-border rounded-lg p-3 animate-pulse"></div>
          </div>
        </div>

        <div class="h-px bg-neutral-border"></div>

        <!-- Filters -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-[11px] font-semibold text-neutral-muted uppercase tracking-wider">Filters</h3>
            <span class="text-[10px] text-neutral-sec" id="ticket-count"></span>
          </div>
          
          <div class="space-y-3">
            <div class="space-y-1">
              <label class="text-[11px] font-medium text-neutral-sec">Status</label>
              <select onchange="setFilter('status', this.value)" class="w-full bg-white border border-neutral-border rounded-md px-2 py-1.5 text-sm text-neutral-main focus:outline-none focus:border-brand transition-colors">
                <option value="all">All statuses</option>
                <option value="new">New</option>
                <option value="in_progress">In progress</option>
                <option value="resolved">Resolved</option>
              </select>
            </div>
            <div class="space-y-1">
              <label class="text-[11px] font-medium text-neutral-sec">Language</label>
              <select onchange="setFilter('lang', this.value)" class="w-full bg-white border border-neutral-border rounded-md px-2 py-1.5 text-sm text-neutral-main focus:outline-none focus:border-brand transition-colors">
                <option value="all">All languages</option>
                <option value="hi">Hindi</option>
                <option value="en">English</option>
                <option value="te">Telugu</option>
                <option value="mr">Marathi</option>
                <option value="bn">Bengali</option>
                <option value="ta">Tamil</option>
              </select>
            </div>
            <div class="space-y-1">
              <label class="text-[11px] font-medium text-neutral-sec">Category</label>
              <select onchange="setFilter('cat', this.value)" class="w-full bg-white border border-neutral-border rounded-md px-2 py-1.5 text-sm text-neutral-main focus:outline-none focus:border-brand transition-colors">
                <option value="all">All categories</option>
                <option value="electricity">Electricity</option>
                <option value="water">Water</option>
                <option value="roads">Roads</option>
                <option value="sanitation">Sanitation</option>
                <option value="healthcare">Healthcare</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>
        </div>

      </div>
    </aside>

    <!-- CENTER: Call List -->
    <section class="w-full md:w-[380px] lg:w-[420px] bg-white border-r border-neutral-border flex flex-col shrink-0 relative z-0">
      <div id="loading-state" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-10 hidden flex-col items-center justify-center">
        <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-neutral-muted mb-2"></i>
        <span class="text-xs font-medium text-neutral-sec">Syncing calls...</span>
      </div>
      
      <div id="empty-state" class="absolute inset-0 bg-white z-0 hidden flex-col items-center justify-center p-6 text-center">
        <i data-lucide="inbox" class="w-8 h-8 text-neutral-muted mb-3"></i>
        <div class="text-sm font-medium text-neutral-main mb-1">No calls found</div>
        <div class="text-xs text-neutral-sec">Try changing your filters or search query.</div>
      </div>

      <div class="flex-1 overflow-y-auto p-3 space-y-2" id="tickets-list">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- RIGHT: Call Details -->
    <section class="flex-1 bg-neutral-page flex flex-col overflow-y-auto relative">
      <div id="no-selection" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6">
        <i data-lucide="phone" class="w-8 h-8 text-neutral-muted mb-3"></i>
        <div class="text-sm font-medium text-neutral-main">No call selected</div>
        <div class="text-xs text-neutral-sec mt-1">Select a call from the queue to view details.</div>
      </div>
      <div id="ticket-details" class="hidden p-6 lg:p-8 max-w-3xl mx-auto w-full">
        <!-- Rendered via JS -->
      </div>
    </section>

  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 right-6 z-50 px-4 py-3 bg-neutral-main text-white text-xs font-medium rounded-lg shadow-lg flex items-center gap-2">
    <i data-lucide="check-circle-2" class="w-4 h-4 text-status-green"></i>
    <span id="toast-msg">Saved successfully</span>
  </div>

  <script>
    // ── Icons Init ────────────────────────────────────────────────────────
    lucide.createIcons();

    // ── State ──────────────────────────────────────────────────────────────
    const state = { status: 'all', lang: 'all', cat: 'all', search: '', selectedTicketId: null };
    let allTickets = [];

    // ── Audio Chime ────────────────────────────────────────────────────────
    let audioCtx = null;
    function playNotificationChime() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch(e) {}
    }

    // ── Boot & Stream ──────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      loadTickets();
      connectLiveStream();

      document.getElementById('search-input')?.addEventListener('input', (e) => {
        state.search = e.target.value.toLowerCase();
        renderTicketsList();
      });

      try {
        const syncChannel = new BroadcastChannel('lok_swar_ivr_sync');
        syncChannel.onmessage = (e) => {
          if (e.data?.type === 'NEW_CALL_TICKET') {
            if (e.data.ticket) handleLiveIncomingReport(e.data.ticket);
            else loadTickets(true);
          }
        };
      } catch(err) {}

      setInterval(() => { loadTickets(true); }, 12000);
    });

    // ── SSE ────────────────────────────────────────────────────────────────
    let sseSource = null;
    function connectLiveStream() {
      if (!window.EventSource) return;
      try {
        if (sseSource) sseSource.close();
        sseSource = new EventSource('/admin/events');

        sseSource.addEventListener('connected', () => {
          const badge = document.getElementById('live-stream-badge');
          if (badge) {
            badge.classList.remove('hidden');
            badge.innerHTML = '<div class="w-1.5 h-1.5 rounded-full bg-status-green"></div>Live';
          }
        });

        sseSource.addEventListener('new_call_report', (e) => {
          try { handleLiveIncomingReport(JSON.parse(e.data)); } catch (err) {}
        });

        sseSource.onerror = () => {
          const badge = document.getElementById('live-stream-badge');
          if (badge) {
            badge.classList.remove('hidden');
            badge.innerHTML = '<div class="w-1.5 h-1.5 rounded-full bg-status-amber"></div>Reconnecting';
          }
          if (sseSource) sseSource.close();
          setTimeout(connectLiveStream, 4000);
        };
      } catch (err) {}
    }

    function handleLiveIncomingReport(report) {
      playNotificationChime();
      showToast('New call received');

      const idx = allTickets.findIndex(t => t.id === report.id);
      if (idx >= 0) allTickets[idx] = report;
      else allTickets.unshift(report);

      renderStats(allTickets.length, allTickets);
      renderTicketsList();
      if(state.selectedTicketId === report.id) renderTicketDetails();
    }

    // ── Fetch ──────────────────────────────────────────────────────────────
    async function loadTickets(silent = false) {
      if (!silent) {
        document.getElementById('loading-state').classList.remove('hidden');
        document.getElementById('empty-state').classList.add('hidden');
      }
      try {
        const params = new URLSearchParams({ limit: 200 });
        if (state.status !== 'all') params.set('status', state.status);
        if (state.lang !== 'all') params.set('lang', state.lang);
        if (state.cat !== 'all') params.set('category', state.cat);

        const res = await fetch(`/admin/tickets?${params}`);
        const data = await res.json();
        const incomingTickets = data.tickets || [];

        const hasChanged = !silent || (allTickets.length !== incomingTickets.length) ||
          JSON.stringify(allTickets.map(t => [t.id, t.status, t.admin_notes, t.duration])) !==
          JSON.stringify(incomingTickets.map(t => [t.id, t.status, t.admin_notes, t.duration]));

        if (!hasChanged) return;

        if (allTickets.length > 0 && incomingTickets.length > allTickets.length) {
          playNotificationChime();
        }

        allTickets = incomingTickets;
        renderStats(data.total || 0, allTickets);
        renderTicketsList();
        
        // Ensure detail view updates if the currently selected ticket data changed
        if (state.selectedTicketId) {
            const stillExists = allTickets.find(t => t.id === state.selectedTicketId);
            if (stillExists) renderTicketDetails();
            else selectTicket(null);
        }
      } catch (err) {
        if (!silent) showToast('Failed to load tickets', 'error');
      } finally {
        if (!silent) document.getElementById('loading-state').classList.add('hidden');
      }
    }

    // ── Render Stats ───────────────────────────────────────────────────────
    function renderStats(total, tickets) {
      const counts = { new: 0, in_progress: 0, resolved: 0 };
      tickets.forEach(t => { if (counts[t.status] !== undefined) counts[t.status]++; });

      document.getElementById('stats-bar').innerHTML = `
        <div class="bg-white border border-neutral-border rounded-lg p-2.5">
          <div class="text-[10px] font-medium text-neutral-muted mb-0.5">Total Calls</div>
          <div class="text-lg font-semibold text-neutral-main leading-none">${total}</div>
        </div>
        <div class="bg-white border border-neutral-border rounded-lg p-2.5">
          <div class="text-[10px] font-medium text-neutral-muted mb-0.5">New</div>
          <div class="text-lg font-semibold text-neutral-main leading-none">${counts.new}</div>
        </div>
        <div class="bg-white border border-neutral-border rounded-lg p-2.5">
          <div class="text-[10px] font-medium text-neutral-muted mb-0.5">In Progress</div>
          <div class="text-lg font-semibold text-neutral-main leading-none">${counts.in_progress}</div>
        </div>
        <div class="bg-white border border-neutral-border rounded-lg p-2.5">
          <div class="text-[10px] font-medium text-neutral-muted mb-0.5">Resolved</div>
          <div class="text-lg font-semibold text-neutral-main leading-none">${counts.resolved}</div>
        </div>
      `;
    }

    // ── Selection Logic ────────────────────────────────────────────────────
    function selectTicket(id) {
      state.selectedTicketId = id;
      renderTicketsList();
      if(id) {
        document.getElementById('no-selection').classList.add('hidden');
        document.getElementById('ticket-details').classList.remove('hidden');
        renderTicketDetails();
      } else {
        document.getElementById('no-selection').classList.remove('hidden');
        document.getElementById('ticket-details').classList.add('hidden');
      }
    }

    // ── Render List ────────────────────────────────────────────────────────
    function renderTicketsList() {
      const query = state.search;
      const filtered = allTickets.filter(t => {
        const phone = t.caller_phone || '+91 8926160600';
        if (query && !phone.toLowerCase().includes(query) &&
            !t.call_sid.toLowerCase().includes(query) &&
            !(t.transcription || '').toLowerCase().includes(query) &&
            !(t.admin_notes || '').toLowerCase().includes(query)) return false;
        return true;
      });

      const listEl = document.getElementById('tickets-list');
      const emptyEl = document.getElementById('empty-state');
      document.getElementById('ticket-count').textContent = `${filtered.length} calls`;

      if (filtered.length === 0) {
        listEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        return;
      }
      
      emptyEl.classList.add('hidden');
      
      let html = '';
      filtered.forEach(t => {
        const isSelected = state.selectedTicketId === t.id;
        const displayPhone = t.caller_phone || '+91 8926160600';
        const createdAt = t.created_at ? new Date(t.created_at) : new Date();
        const timeStr = createdAt.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short' });
        
        // Status indicator
        let statusDot = 'bg-status-red';
        let statusLabel = 'NEW';
        if (t.status === 'in_progress') { statusDot = 'bg-status-amber'; statusLabel = 'IN PROGRESS'; }
        if (t.status === 'resolved') { statusDot = 'bg-status-green'; statusLabel = 'RESOLVED'; }

        const catLabel = t.category ? t.category.charAt(0).toUpperCase() + t.category.slice(1) : 'Unknown';
        
        let transcriptPreview = t.transcription || 'No transcript available';
        if (transcriptPreview.length > 55) transcriptPreview = transcriptPreview.substring(0, 55) + '...';

        const langLabel = { hi: 'Hindi', te: 'Telugu', en: 'English', mr: 'Marathi', bn: 'Bengali', ta: 'Tamil' }[t.language] || t.language || 'Unknown';

        html += `
          <div onclick="selectTicket('${t.id}')" 
            class="relative rounded-lg p-3 cursor-pointer border transition-colors ${isSelected ? 'list-item-active' : 'bg-white border-neutral-border hover:border-neutral-muted'}">
            
            <div class="absolute left-0 top-0 bottom-0 w-0.5 item-indicator rounded-l-lg ${isSelected ? '' : 'bg-transparent'}"></div>

            <div class="flex justify-between items-start mb-1.5">
              <div class="flex items-center gap-2">
                <span class="font-semibold text-neutral-main text-sm">${displayPhone}</span>
                <span class="text-[9px] font-bold tracking-wide text-neutral-sec flex items-center gap-1">
                  <span class="w-1.5 h-1.5 rounded-full ${statusDot}"></span>
                  ${statusLabel}
                </span>
              </div>
              <span class="text-[10px] text-neutral-muted font-medium">${timeStr}</span>
            </div>

            <div class="text-[11px] font-medium text-neutral-main mb-1.5">${catLabel}</div>
            <div class="text-xs text-neutral-sec truncate italic mb-2">"${transcriptPreview}"</div>
            
            <div class="flex items-center gap-2 text-[10px] text-neutral-muted font-medium">
              <span>${t.duration > 0 ? t.duration : 15} sec</span>
              <span>·</span>
              <span>${langLabel}</span>
              <span>·</span>
              <span>#${t.id.slice(-6).toUpperCase()}</span>
            </div>
          </div>
        `;
      });
      
      listEl.innerHTML = html;
    }

    // ── Render Details ─────────────────────────────────────────────────────
    function renderTicketDetails() {
      const t = allTickets.find(t => t.id === state.selectedTicketId);
      if (!t) return;

      const container = document.getElementById('ticket-details');
      
      const displayPhone = t.caller_phone || '+91 8926160600';
      const createdAt = t.created_at ? new Date(t.created_at) : new Date();
      const timeStr = createdAt.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short' });
      const catLabel = t.category ? t.category.charAt(0).toUpperCase() + t.category.slice(1) : 'Unknown';
      const langLabel = { hi: 'Hindi', te: 'Telugu', en: 'English', mr: 'Marathi', bn: 'Bengali', ta: 'Tamil' }[t.language] || t.language || 'Unknown';
      
      let statusLabel = 'New';
      if (t.status === 'in_progress') statusLabel = 'In progress';
      if (t.status === 'resolved') statusLabel = 'Resolved';

      let audioSrc = t.recording_url || '';
      if (t.recording_sid && t.recording_sid !== 'RE_MOCK') {
        audioSrc = `/ivr/audio/${t.recording_sid}`;
      }

      const transcriptText = t.transcription || 'Transcript unavailable.';
      const translationText = t.english_translation || 'Translation unavailable.';

      container.innerHTML = `
        <div class="space-y-8 pb-8 fade-in">
          
          <!-- Header -->
          <div class="border-b border-neutral-border pb-5">
            <h2 class="text-[11px] font-semibold text-neutral-muted uppercase tracking-wider mb-2">Call Details</h2>
            <div class="text-2xl font-semibold text-neutral-main mb-1">${displayPhone}</div>
            <div class="text-xs text-neutral-sec font-medium flex items-center gap-2">
              <span>Ticket #${t.id.slice(-6).toUpperCase()}</span>
              <span>·</span>
              <span>${timeStr}</span>
            </div>
            <div class="flex items-center gap-2 mt-4">
              <span class="px-2 py-1 rounded bg-neutral-border text-[10px] font-semibold text-neutral-main uppercase tracking-wide">
                ${statusLabel}
              </span>
              <span class="px-2 py-1 rounded bg-neutral-page border border-neutral-border text-[10px] font-medium text-neutral-sec uppercase tracking-wide">
                ${catLabel}
              </span>
            </div>
          </div>

          <!-- Section 1: Audio -->
          <div class="space-y-2">
            <h3 class="text-[11px] font-semibold text-neutral-sec uppercase tracking-wider">Call Recording</h3>
            ${audioSrc 
              ? `<audio controls class="w-full max-w-sm" src="${audioSrc}"></audio>` 
              : `<div class="text-sm text-neutral-muted italic">No audio recorded.</div>`}
          </div>

          <!-- Section 2: Transcript -->
          <div class="space-y-2">
            <h3 class="text-[11px] font-semibold text-neutral-sec uppercase tracking-wider">Caller Message</h3>
            <div class="bg-white border border-neutral-border rounded-lg p-4 text-sm text-neutral-main leading-relaxed">
              ${transcriptText}
            </div>
          </div>

          <!-- Section 3: Translation (Optional if English, but keeping logic simple) -->
          ${t.language !== 'en' ? `
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <h3 class="text-[11px] font-semibold text-neutral-sec uppercase tracking-wider">Translation</h3>
              <span class="text-[10px] text-neutral-muted">Original: ${langLabel}</span>
            </div>
            <div class="bg-white border border-neutral-border rounded-lg p-4 text-sm text-neutral-main leading-relaxed">
              ${translationText}
            </div>
          </div>
          ` : ''}

          <!-- Section 4 & 5 & 6: Meta Grid -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="space-y-2">
              <h3 class="text-[11px] font-semibold text-neutral-sec uppercase tracking-wider">Issue</h3>
              <div class="text-sm text-neutral-main font-medium">${catLabel}</div>
              <div class="text-xs text-neutral-sec mt-1">General ${t.category} issue</div>
            </div>
            
            <div class="space-y-2">
              <h3 class="text-[11px] font-semibold text-neutral-sec uppercase tracking-wider">Status</h3>
              <select onchange="updateStatus('${t.id}', this.value)" class="w-full max-w-[160px] bg-white border border-neutral-border rounded-md px-3 py-1.5 text-sm text-neutral-main focus:outline-none focus:border-brand">
                <option value="new" ${t.status==='new'?'selected':''}>New</option>
                <option value="in_progress" ${t.status==='in_progress'?'selected':''}>In progress</option>
                <option value="resolved" ${t.status==='resolved'?'selected':''}>Resolved</option>
              </select>
            </div>

            <div class="space-y-2">
              <h3 class="text-[11px] font-semibold text-neutral-sec uppercase tracking-wider">SLA</h3>
              <div class="text-sm text-neutral-main flex items-center gap-1.5">
                <i data-lucide="clock" class="w-4 h-4 text-neutral-muted"></i>
                24h SLA active
              </div>
            </div>

          </div>

          <!-- Section 7: Action / Notes -->
          <div class="space-y-3 pt-4 border-t border-neutral-border">
            <h3 class="text-[11px] font-semibold text-neutral-sec uppercase tracking-wider">Action / Resolution Notes</h3>
            <textarea id="notes-${t.id}" rows="3" placeholder="Add investigation notes or work order ID..."
              class="w-full bg-white border border-neutral-border rounded-lg px-4 py-3 text-sm text-neutral-main placeholder:text-neutral-muted focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-colors resize-y">${t.admin_notes || ''}</textarea>
            <div>
              <button onclick="saveNotes('${t.id}')" class="px-5 py-2 bg-brand text-white text-sm font-medium rounded-md hover:bg-brand-hover transition-colors shadow-sm">
                Save Notes
              </button>
            </div>
          </div>
          
        </div>
      `;
      // Re-init lucide icons for the newly injected HTML
      lucide.createIcons();
    }

    // ── API Actions ────────────────────────────────────────────────────────
    async function updateStatus(id, status) {
      try {
        const res = await fetch(`/admin/tickets/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        if (!res.ok) throw new Error('API error');
        showToast('Status updated');
        const ticket = allTickets.find(t => t.id === id);
        if (ticket) ticket.status = status;
        renderTicketsList();
        renderTicketDetails();
      } catch {
        showToast('Update failed', 'error');
      }
    }

    async function saveNotes(id) {
      const notes = document.getElementById(`notes-${id}`)?.value || '';
      try {
        const res = await fetch(`/admin/tickets/${id}/notes`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admin_notes: notes })
        });
        if (!res.ok) throw new Error('API error');
        showToast('Notes saved');
        const ticket = allTickets.find(t => t.id === id);
        if (ticket) ticket.admin_notes = notes;
      } catch {
        showToast('Save failed', 'error');
      }
    }

    async function createMockTicket() {
      try {
        await fetch('/ivr/test/create-mock', { method: 'POST' });
        showToast('New call created');
        await loadTickets();
      } catch {
        showToast('Failed to create ticket', 'error');
      }
    }

    // ── Toast ──────────────────────────────────────────────────────────────
    let _toastTimer;
    function showToast(msg, type = 'success') {
      const el = document.getElementById('toast');
      const text = document.getElementById('toast-msg');
      const icon = el.querySelector('i');
      text.textContent = msg;
      
      if(type === 'error') {
        el.classList.replace('bg-neutral-main', 'bg-status-red');
        icon.setAttribute('data-lucide', 'alert-circle');
        icon.classList.replace('text-status-green', 'text-white');
      } else {
        el.classList.replace('bg-status-red', 'bg-neutral-main');
        icon.setAttribute('data-lucide', 'check-circle-2');
        icon.classList.replace('text-white', 'text-status-green');
      }
      lucide.createIcons();

      el.classList.remove('hidden');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => { el.classList.add('hidden'); }, 3000);
    }
  </script>
</body>
</html>
