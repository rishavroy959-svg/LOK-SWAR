    // Intelligent Automatic Title Synthesizer for Submitted Problems
    function generateAutoProblemTitle(text, category, voiceMeta) {
      const t = (text || "").trim();
      if (voiceMeta && voiceMeta.aiAnalyzedTitle && voiceMeta.aiAnalyzedTitle !== text) {
        return voiceMeta.aiAnalyzedTitle;
      }
      const lower = t.toLowerCase();

      // Power & Electricity
      if (lower.includes('electric') || lower.includes('pole') || lower.includes('wire') || lower.includes('power') || lower.includes('current') || lower.includes('transformer') || lower.includes('बिजली') || lower.includes('खंभा') || lower.includes('विद्युत') || lower.includes('ବିଜୁଳି') || lower.includes('जर गइल') || lower.includes('बिजुलिया') || lower.includes('लाइन नइखे')) {
        if (lower.includes('fall') || lower.includes('fell') || lower.includes('broken') || lower.includes('गिर') || lower.includes('टूट') || lower.includes('ଭାଙ୍ଗି')) {
          return "Electricity Pole Collapse & 33kV Power Hazard";
        }
        if (lower.includes('transformer') || lower.includes('blast') || lower.includes('जल गया') || lower.includes('जर गइल')) {
          return "Distribution Transformer Failure & Blackout";
        }
        return "Village Electricity Outage & Grid Failure";
      }

      // Roads & Bridges
      if (lower.includes('bridge') || lower.includes('pul') || lower.includes('pulia') || lower.includes('पुल') || lower.includes('पुलिया') || lower.includes('पुलवा') || lower.includes('ପୋଲ')) {
        if (lower.includes('collapse') || lower.includes('wash') || lower.includes('flood') || lower.includes('बह') || lower.includes('टूट') || lower.includes('गइल')) {
          return "Critical Bridge Washout & Transportation Disruption";
        }
        return "Bridge Structural Damage & Access Hazard";
      }
      if (lower.includes('road') || lower.includes('rasta') || lower.includes('highway') || lower.includes('सड़क') || lower.includes('रास्ता') || lower.includes('सड़किया') || lower.includes('ରାସ୍ତା')) {
        if (lower.includes('flood') || lower.includes('mud') || lower.includes('water') || lower.includes('पानी') || lower.includes('बाढ़') || lower.includes('भरल')) {
          return "Severe Monsoon Road Inundation & Village Cut-Off";
        }
        if (lower.includes('pothole') || lower.includes('gaddha') || lower.includes('गड्ढा') || lower.includes('गड़हा') || lower.includes('ଖାଲ')) {
          return "Severe Pothole Damage & Hazardous Roadway";
        }
        return "Damaged Roadway Requiring PMGSY Re-Surfacing";
      }

      // Drinking Water & RWSS
      if (lower.includes('water') || lower.includes('pani') || lower.includes('handpump') || lower.includes('tap') || lower.includes('borewell') || lower.includes('fluoride') || lower.includes('drinking') || lower.includes('pipe') || lower.includes('पानी') || lower.includes('पनिया') || lower.includes('चापाकल') || lower.includes('चापकाल') || lower.includes('ପାଣି')) {
        if (lower.includes('broken') || lower.includes('leak') || lower.includes('damage') || lower.includes('नल') || lower.includes('टूट') || lower.includes('खराब') || lower.includes('बिगड़ल')) {
          return "Drinking Water Pipeline & Community Tap Breakdown";
        }
        if (lower.includes('dry') || lower.includes('shortage') || lower.includes('scarcity') || lower.includes('सूख') || lower.includes('नइखे')) {
          return "Acute Drinking Water Crisis & Borewell Depletion";
        }
        if (lower.includes('fluoride') || lower.includes('yellow') || lower.includes('ganda') || lower.includes('गंदा')) {
          return "Severe Drinking Water Contamination Hazard";
        }
        return "Jal Jeevan Drinking Water Infrastructure Grievance";
      }

      // Healthcare
      if (lower.includes('hospital') || lower.includes('doctor') || lower.includes('phc') || lower.includes('medicine') || lower.includes('clinic') || lower.includes('health') || lower.includes('nurse') || lower.includes('ambulance') || lower.includes('अस्पताल') || lower.includes('डाक्टर') || lower.includes('ଡାକ୍ତର')) {
        if (lower.includes('absent') || lower.includes('nahi') || lower.includes('नहीं') || lower.includes('नइखन')) {
          return "Primary Health Center Doctor Absenteeism & Service Failure";
        }
        if (lower.includes('ambulance') || lower.includes('गाड़ी') || lower.includes('एंबुलेंस')) {
          return "Emergency 108 Ambulance Delay & Critical Access Barrier";
        }
        return "Emergency Medical Facility & Pharmacy Access Issue";
      }

      // Education / School
      if (lower.includes('school') || lower.includes('roof') || lower.includes('classroom') || lower.includes('student') || lower.includes('teacher') || lower.includes('स्कूल') || lower.includes('स्कूलवा') || lower.includes('छत') || lower.includes('ବିଦ୍ୟାଳୟ')) {
        if (lower.includes('roof') || lower.includes('leak') || lower.includes('collapse') || lower.includes('छत') || lower.includes('चुअता') || lower.includes('टपक')) {
          return "Government School Classroom Roof Leakage & Safety Hazard";
        }
        return "School Academic Facility & Classroom Grievance";
      }

      // Drainage & Floods
      if (lower.includes('drain') || lower.includes('sewage') || lower.includes('overflow') || lower.includes('flood') || lower.includes('waterlog') || lower.includes('नाली') || lower.includes('नाला') || lower.includes('जलजमाव')) {
        return "Monsoon Drainage Channel Overflow & Village Waterlogging";
      }

      // Canal & Irrigation
      if (lower.includes('canal') || lower.includes('irrigation') || lower.includes('farmer') || lower.includes('crop') || lower.includes('नहर') || lower.includes('सिंचाई') || lower.includes('पटवन') || lower.includes('କେନାଲ')) {
        return "Canal Water Supply Breach & Agricultural Irrigation Disruption";
      }

      if (t) {
        const cleanT = t.replace(/^["']|["']$/g, '').trim();
        const words = cleanT.split(/\s+/);
        if (words.length <= 7) {
          return cleanT.charAt(0).toUpperCase() + cleanT.slice(1);
        }
        return words.slice(0, 7).join(" ").replace(/[,.;:]$/, "") + "...";
      }

      return (category && category !== 'General') ? `${category} Infrastructure Grievance` : "Public Infrastructure Grievance";
    }

      const [isAadhaarVerified, setIsAadhaarVerified] = useState(Boolean(citizenUser?.isAadhaarVerified));

      // Grievance Location Selection Modal State (Auto GPS Satellite Detection & Manual Address Intake)
      const [isLocationSelectModalOpen, setIsLocationSelectModalOpen] = useState(false);
      const [pendingGrievanceData, setPendingGrievanceData] = useState(null);
      const [locationChoiceMode, setLocationChoiceMode] = useState('auto'); // 'auto' | 'manual'
      const [isFetchingSubmitGps, setIsFetchingSubmitGps] = useState(false);
      const [submitGpsDetails, setSubmitGpsDetails] = useState({
        lat: 22.1245,
        lng: 84.0321,
        address: "Janla, Khordha, Odisha",
        state: "Odisha",
        district: "Khordha",
        accuracy: "± 4.2 meters (Verified GPS)",

        if (!gpsStr) return { lat: 22.1245, lng: 84.0321 };
        if (typeof gpsStr === 'object' && gpsStr.lat && gpsStr.lng) return gpsStr;
        const matches = String(gpsStr).match(/([\d.]+)[^\d,]*([NSns])?[^\d]+([\d.]+)[^\d,]*([EWew])?/);
        if (matches) {
          let lat = parseFloat(matches[1]);
          if (matches[2] && (matches[2].toUpperCase() === 'S')) lat = -lat;
          let lng = parseFloat(matches[3]);
          if (matches[4] && (matches[4].toUpperCase() === 'W')) lng = -lng;
          if (!isNaN(lat) && !isNaN(lng)) return { lat, lng };
        }
        return { lat: 22.1245, lng: 84.0321 };

        const dLng = (loc2.lng - loc1.lng) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(loc1.lat * Math.PI / 180) * Math.cos(loc2.lat * Math.PI / 180) *
          Math.sin(dLng / 2) * Math.sin(dLng / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return parseFloat((R * c).toFixed(2));

        if (

        // 5. High-Precision Coordinate Bounding Box Fallback
        if (lat !== null && lng !== null) {

      // Applies Location Data and Automatically Updates ALL UI Texts to Regional Language
      const applyLocationAndDialect = ({ latitude, longitude, detectedRegion, detectedLang, areaLabel }) => {

      // Request Precise Real User Location via Geolocation + OpenStreetMap Reverse Geocoding
      const requestLocationAndAutoSetLanguage = async (interactive = false) => {
        setIsDetectingLocation(true);

        if (!navigator.geolocation) {
          // Fallback to IP Geolocation if HTML5 Geolocation is unavailable
          try {
            const ipRes = await fetch('https://ipapi.co/json/');
            const ipData = await ipRes.json();
            if (ipData && (ipData.region || ipData.city || ipData.latitude)) {
              const state = ipData.region || '';
              const district = ipData.city || '';
              const lat = ipData.latitude || 22.1245;
              const lon = ipData.longitude || 84.0321;
              const dialectInfo = detectDialectFromLocation(state, district, lat, lon);
              const detectedRegion = [district, state, 'India'].filter(Boolean).join(', ');
              applyLocationAndDialect({
                latitude: lat,
                longitude: lon,
                detectedRegion,
                detectedLang: dialectInfo.lang,
                areaLabel: dialectInfo.label
              });
              return;
            }
          } catch (e) { }
          setIsDetectingLocation(false);
          return;
        }

        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const { latitude, longitude } = pos.coords;
            let detectedLang = 'hi';
            let detectedRegion = 'Current Location';
            let areaLabel = 'Hindi (हिन्दी)';

            // 1. High-Precision Reverse Geocoding via OpenStreetMap Nominatim API
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`, {
                headers: { 'Accept': 'application/json' }
              });
              const geoData = await res.json();
              if (geoData && geoData.address) {
                const addr = geoData.address;
                const state = (addr.state || '');
                const district = addr.state_district || addr.county || addr.district || addr.city || addr.town || '';
                
                // Deep Granular Precision: Road, Sector/Locality, Suburb/Village, Ward, District, State, Pincode
                const landmark = addr.building || addr.amenity || addr.leisure || addr.historic || '';
                const road = addr.road || addr.street || addr.footway || addr.path || '';
                const locality = addr.neighbourhood || addr.suburb || addr.residential || addr.hamlet || addr.village || addr.town || '';
                const wardSector = addr.city_district || addr.ward || addr.sector || '';
                const cityTown = addr.city || addr.town || addr.county || '';
                const pin = addr.postcode || '';

                const detailedParts = [landmark, road, locality, wardSector, cityTown, district, state, pin].filter(Boolean);
                const uniqueParts = [];
                detailedParts.forEach(p => {
                  if (p && !uniqueParts.some(existing => existing.toLowerCase() === p.toLowerCase())) {
                    uniqueParts.push(p);
                  }
                });

                detectedRegion = uniqueParts.join(', ') || addr.display_name || `${latitude.toFixed(5)}° N, ${longitude.toFixed(5)}° E`;

                const dialectInfo = detectDialectFromLocation(state, district, latitude, longitude);
                detectedLang = dialectInfo.lang;
                areaLabel = dialectInfo.label;
              } else {
                const fallbackInfo = detectDialectFromLocation('', '', latitude, longitude);
                detectedLang = fallbackInfo.lang;
                areaLabel = fallbackInfo.label;
              }
            } catch (e) {
              const fallbackInfo = detectDialectFromLocation('', '', latitude, longitude);
              detectedLang = fallbackInfo.lang;
              areaLabel = fallbackInfo.label;
              if (detectedLang === 'or') detectedRegion = 'Sundargarh, Odisha';
              else if (detectedLang === 'bho') detectedRegion = 'Bhojpur, Patna, Bihar';
              else if (detectedLang === 'bn') detectedRegion = 'Kolkata, West Bengal';
              else detectedRegion = 'Northern India Region';
            }

            applyLocationAndDialect({
              latitude,
              longitude,
              detectedRegion,
              detectedLang,
              areaLabel
            });
          },
          async (err) => {
            console.warn('Geolocation notice, trying IP fallback:', err);
            try {
              const ipRes = await fetch('https://ipapi.co/json/');
              const ipData = await ipRes.json();
              if (ipData && (ipData.region || ipData.city || ipData.latitude)) {
                const state = ipData.region || '';
                const district = ipData.city || '';
                const lat = ipData.latitude || 22.1245;
                const lon = ipData.longitude || 84.0321;
                const dialectInfo = detectDialectFromLocation(state, district, lat, lon);
                const detectedRegion = [district, state, 'India'].filter(Boolean).join(', ');
                applyLocationAndDialect({
                  latitude: lat,
                  longitude: lon,
                  detectedRegion,
                  detectedLang: dialectInfo.lang,

          if (d === 'roads') return cat.includes('road') || cat.includes('bridge') || cat.includes('connectivity') || title.includes('road') || title.includes('bridge') || orig.includes('सड़क') || orig.includes('पुल') || orig.includes('ରାସ୍ତା') || orig.includes('ସେତୁ') || eng.includes('road') || eng.includes('bridge');

      // Intelligent Survival, Support & Proximity Ranking Engine
      const getRankedProblems = (problemsList, userLoc, deptFilter, radiusKm) => {

          const fullText = `${prob.title || ''} ${prob.titleOriginal || ''} ${prob.directEnglishTranslation || ''} ${prob.adminEnglishTranslation || ''} ${cat}`.toLowerCase();

          // Survival / Natural Disaster Criteria:
          // Floods, collapsed bridges, cut-off roads, high-voltage live wire hazards, drinking water contamination
          const isSurvivalDisaster =
            fullText.includes('flood') || fullText.includes('बाढ़') || fullText.includes('ବାତ୍ୟା') || fullText.includes('जलभराव') || fullText.includes('inundat') ||

            fullText.includes('bridge') || fullText.includes('pul') || fullText.includes('पुल') || fullText.includes('पुलवा') || fullText.includes('ସେତୁ') ||
            fullText.includes('disaster') || fullText.includes('hazard') || fullText.includes('emergency') ||
            fullText.includes('33kv') || fullText.includes('transformer') || fullText.includes('live wire') || fullText.includes('current') ||
            fullText.includes('antivenom') || fullText.includes('hospital') || fullText.includes('ambulance') ||
            fullText.includes('scarcity') || fullText.includes('crisis') || fullText.includes('contamination');

          let priorityScore = 0;
          // 1. Survival & Emergency Disaster Bonus (Top Priority Tier)
          if (isSurvivalDisaster) {
            priorityScore += 300;
          } else if (cat.includes('road') || cat.includes('water') || cat.includes('power')) {
            priorityScore += 120;
          } else {
            priorityScore += 50;

          // 2. User Supports / Upvotes (5 pts per community endorsement)
          const votes = prob.votes || 1;
          priorityScore += votes * 15;

          // 3. Base Urgency Assessment (0 - 100)
          priorityScore += (prob.urgencyScore || 85) * 1.5;

          // 4. Proximity Relevance to user's real location
          priorityScore += Math.max(0, (30 - distKm) * 2);

          return {
            ...prob,
            distKm,
            parsedCoords: coords,
            isSurvivalDisaster,
            priorityScore: Math.round(priorityScore)
          };
        });

        // Filter within radius
        const radiusFiltered = mapped.filter(p => radiusKm >= 50 || p.distKm <= radiusKm);

        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          if (ctx.state === 'suspended') ctx.resume();

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'tap') {
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
          } else if (type === 'success') {
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.06, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);

      // PCM 16-bit 16kHz WAV Audio Encoder
      const encodeWAV = (samples, sampleRate = 16000) => {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);
        const writeStr = (v, offset, str) => {
          for (let i = 0; i < str.length; i++) v.setUint8(offset + i, str.charCodeAt(i));
        };
        writeStr(view, 0, 'RIFF');
        view.setUint32(4, 36 + samples.length * 2, true);
        writeStr(view, 8, 'WAVE');
        writeStr(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); // PCM format
        view.setUint16(22, 1, true); // Mono
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeStr(view, 36, 'data');
        view.setUint32(40, samples.length * 2, true);
        let offset = 44;
        for (let i = 0; i < samples.length; i++, offset += 2) {
          const s = Math.max(-1, Math.min(1, samples[i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        return new Blob([view], { type: 'audio/wav' });
      };

      const downsampleBuffer = (buffer, inRate, outRate = 16000) => {
        if (inRate === outRate) return buffer;
        const ratio = inRate / outRate;
        const newLen = Math.round(buffer.length / ratio);
        const result = new Float32Array(newLen);
        let offsetResult = 0;
        let offsetBuffer = 0;
        while (offsetResult < result.length) {
          const nextOffset = Math.round((offsetResult + 1) * ratio);
          let accum = 0, count = 0;
          for (let i = offsetBuffer; i < nextOffset && i < buffer.length; i++) {
            accum += buffer[i];
            count++;
          }
          result[offsetResult] = count > 0 ? accum / count : 0;
          offsetResult++;
          offsetBuffer = nextOffset;
        }
        return result;
      };

      const convertPcmToWavBase64 = () => {
        if (!pcmChunksRef.current || pcmChunksRef.current.length === 0) return null;
        try {
          const totalLen = pcmChunksRef.current.reduce((acc, c) => acc + c.length, 0);
          const merged = new Float32Array(totalLen);
          let offset = 0;
          for (const chunk of pcmChunksRef.current) {
            merged.set(chunk, offset);
            offset += chunk.length;
          }
          const inRate = audioContextRef.current ? audioContextRef.current.sampleRate : 44100;
          const downsampled = downsampleBuffer(merged, inRate, 16000);
          const wavBlob = encodeWAV(downsampled, 16000);

          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(wavBlob);
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = () => resolve(null);
          });
        } catch (err) {
          return null;
        }
      };

      // Real-time AI Translation to English with smooth typewriter into Search Bar

      const handleCancelRecording = () => {
        setIsRecording(false);
        isRecordingRef.current = false;

        }
        if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);

      stopVoiceRecordingRef.current = stopVoiceRecording;

      const toggleVoiceRecording = async () => {
        if (isRecordingRef.current) {

          muteAllSpeech();
          playChime('tap');

          isRecordingRef.current = true;
          setIsRecording(true);
          setAudioVolumeLevel(0.3);

          setSilenceProgress(0);
          hasSpokenRef.current = false;

            if (!isRecordingRef.current) return;

              if (silenceMs >= 1300 && !isAutoStoppingRef.current && isRecordingRef.current) {

          if (SpeechRec) {

              let accumulatedText = '';
              rec.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                  if (event.results[i].isFinal) {
                    accumulatedText += event.results[i][0].transcript + ' ';
                  } else {
                    interim += event.results[i][0].transcript;
                  }

                if (currentSpoken.length > 0) {

                  lastVoiceTimeRef.current = Date.now();
                  setIsSilenceDetected(false);
                  rawTranscriptRef.current = currentSpoken;

                const analyser = ctx.createAnalyser();
                analyser.fftSize = 512;
                analyserRef.current = analyser;
                source.connect(analyser);

                  if (!isRecordingRef.current) return;
                  const channelData = audioEvent.inputBuffer.getChannelData(0);
                  pcmChunksRef.current.push(new Float32Array(channelData));

                  let sumSquares = 0;
                  for (let i = 0; i < channelData.length; i++) {
                    sumSquares += channelData[i] * channelData[i];
                  }
                  const rms = Math.sqrt(sumSquares / channelData.length);

                  setAudioVolumeLevel(normVol);

                  if (rms > 0.012) {
                    hasSpokenRef.current = true;
                    lastVoiceTimeRef.current = Date.now();

                  } else if (hasSpokenRef.current && (Date.now() - speechStartTimeRef.current) > 1000) {

                      if (stopVoiceRecordingRef.current) {

                  }

                source.connect(scriptNode);
                scriptNode.connect(ctx.destination);

            }
          } catch (err) { }
