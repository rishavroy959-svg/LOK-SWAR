<html lang="hi">

<head>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & Babel CDN -->

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Leaflet GIS Interactive Map CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Modular Citizen Portal Subsystems (Icons, Location, Voice, i18n, Views) -->
  <script src="js/citizen/icons.js"></script>
  <script src="js/citizen/location_data.js"></script>

  <!-- Google Fonts: Montserrat, Rochester, Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&family=Rochester&display=swap"
    rel="stylesheet">

  <style>
    /* Bulletproof SVG dimensions so icons never expand before Tailwind CDN finishes */
    svg { max-width: 100%; display: inline-block; }
    svg.w-3 { width: 0.75rem !important; height: 0.75rem !important; }
    svg.w-3\.5 { width: 0.875rem !important; height: 0.875rem !important; }
    svg.w-4 { width: 1rem !important; height: 1rem !important; }
    svg.w-5 { width: 1.25rem !important; height: 1.25rem !important; }
    svg.w-6 { width: 1.5rem !important; height: 1.5rem !important; }
    svg.w-7 { width: 1.75rem !important; height: 1.75rem !important; }
    svg.w-8 { width: 2rem !important; height: 2rem !important; }
    svg.w-9 { width: 2.25rem !important; height: 2.25rem !important; }
    svg.w-10 { width: 2.5rem !important; height: 2.5rem !important; }
    svg.w-11 { width: 2.75rem !important; height: 2.75rem !important; }
    svg.w-12 { width: 3rem !important; height: 3rem !important; }

    html,
    body,
    #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      font-family: 'Montserrat', 'Inter', sans-serif;
    }

    .font-serif-rochester {
      font-family: 'Rochester', 'Caveat', cursive;
    }

    .font-brand {
      font-family: 'Montserrat', sans-serif;
    }

    /* Hero Dot-Pattern Background for Light & Dark Mode */
    .hero-dot-pattern {
      background-color: #f8fafc;
      background-image: radial-gradient(rgba(100, 116, 139, 0.22) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }

    .dark .hero-dot-pattern,
    html.dark .hero-dot-pattern,
    body.dark .hero-dot-pattern {
      background-color: #020617 !important;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.2px, transparent 1.2px) !important;
      background-size: 24px 24px !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.5);
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.8);
    }

    /* Leaflet Map Custom Marker & Popup Styles */
    .leaflet-popup-content-wrapper {

      color: #f8fafc !important;
      border-radius: 16px !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
      padding: 4px !important;
    }

    .leaflet-popup-tip {
      background: #0f172a !important;

    .leaflet-container {
      font-family: 'Montserrat', 'Inter', sans-serif !important;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }

      50% {
        transform: scale(1.35);
        opacity: 0;
      }

      100% {
        transform: scale(0.95);
        opacity: 0;

    .pulse-ring-anim {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;

    /* Centered Textarea and Placeholder inside Search Pill */

<body class="antialiased bg-[#fdfbfb] text-[#4a4643] selection:bg-[#d48c48] selection:text-white relative">
  <div id="root"></div>

  <script>
const {
  useState,
  useEffect,
  useRef
} = React;

// Global Modular Entities from js/citizen/
const SIMULATED_REGIONS = window.SIMULATED_REGIONS;
const Icons = window.Icons;
const CIVIC_BACKGROUNDS = window.CIVIC_BACKGROUNDS;
const INITIAL_NOTIFICATIONS = window.INITIAL_NOTIFICATIONS;
const generateAutoProblemTitle = window.generateAutoProblemTitle;
const parseGpsCoords = window.parseGpsCoords;
const getDistanceKm = window.getDistanceKm;
const LOCATION_TRANSLATION_ENTITIES = window.LOCATION_TRANSLATION_ENTITIES;
const localizeAddress = window.localizeAddress;

function CitizenPortalApp() {
  // Resilient Multi-Host API Fetcher (Supports relative origins, localhost:8000, 127.0.0.1:8000)
  const resilientFetch = async (endpoint, options = {}) => {
    const urls = [];
    if (window.location.protocol !== 'file:' && window.location.origin && window.location.origin !== 'null') {
      urls.push(endpoint);
    }
    urls.push('http://127.0.0.1:8000' + endpoint);
    urls.push('http://localhost:8000' + endpoint);

    for (const url of urls) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), options.timeout || 4000);
        const res = await fetch(url, {
          ...options,
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (res && res.ok) {
          return res;
        }
      } catch (err) {}
    }
    return null;
  };
  // 1. Citizen Identity State (No mock demo data)
  const [citizenUser, setCitizenUser] = useState(() => {
    try {
      const savedStr = localStorage.getItem('lok_swar_citizen_session') || localStorage.getItem('lok_swar_citizen_auth_session');
      let saved = savedStr ? JSON.parse(savedStr) : null;
      if (saved && (saved.name === 'Rishav Yadav' || saved.name === 'Rishav' || saved.mobile === '9861234567')) {
        saved.name = 'Citizen User';
        saved.mobile = '';
      }
      return saved || {
        name: "Citizen User",
        mobile: "",
        village: localStorage.getItem('lok_swar_user_location_name') || "",
        aadhaar: "",
        aadhaarMasked: "",
        isAadhaarVerified: false,
        dpUrl: "assets/bg_1_smart_village.jpg",
        trustScore: 95
      };
    } catch (e) {
      return null;
    }
  });

  // Exact Live Location State (dynamically fetched from user's GPS and reverse geocoding)
  const [currentLocationName, setCurrentLocationName] = useState(() => {
    try {
      const savedLoc = localStorage.getItem('lok_swar_user_location_name') || localStorage.getItem('lok_swar_detected_region');
      if (savedLoc && savedLoc.includes('Janla')) {
        try {
          localStorage.removeItem('lok_swar_user_location_name');
          localStorage.removeItem('lok_swar_detected_region');
          localStorage.removeItem('lok_swar_user_gps');
        } catch (e) {}
        return "Detecting Live Location...";
      }
      return savedLoc || "Detecting Live Location...";
    } catch (e) {
      return "Detecting Live Location...";
    }
  });
  const [mobileInput, setMobileInput] = useState("");
  const [otpInput, setOtpInput] = useState("");
  const [otpSent, setOtpSent] = useState(false);
  const [loginError, setLoginError] = useState("");

  // Profile Modal State
  const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
  const [profileName, setProfileName] = useState(() => citizenUser?.name && citizenUser?.name !== 'Rishav Yadav' && citizenUser?.name !== 'Rishav' ? citizenUser.name : "Citizen User");
  const [profileMobile, setProfileMobile] = useState(() => citizenUser?.mobile && citizenUser?.mobile !== '9861234567' ? citizenUser.mobile : "");
  const [profileVillage, setProfileVillage] = useState(() => citizenUser?.village || currentLocationName || "");
  const [profileAadhaar, setProfileAadhaar] = useState(() => citizenUser?.aadhaar && citizenUser?.aadhaar !== '5482 9104 1940' ? citizenUser.aadhaar : "");
  const [profileDpUrl, setProfileDpUrl] = useState(citizenUser?.dpUrl || "assets/bg_1_smart_village.jpg");
  const [isAadhaarVerified, setIsAadhaarVerified] = useState(Boolean(citizenUser?.isAadhaarVerified));

  // Grievance Location Selection Modal State (Auto GPS Satellite Detection & Manual Address Intake)
  const [isLocationSelectModalOpen, setIsLocationSelectModalOpen] = useState(false);
  const [pendingGrievanceData, setPendingGrievanceData] = useState(null);
  const [locationChoiceMode, setLocationChoiceMode] = useState('auto'); // 'auto' | 'manual'
  const [isFetchingSubmitGps, setIsFetchingSubmitGps] = useState(false);
  const [submitGpsDetails, setSubmitGpsDetails] = useState({
    lat: 28.6139,
    lng: 77.2090,
    address: "Detecting Live Location...",
    state: "National Region",
    district: "Local District",
    accuracy: "± 5.0 meters (Live GPS / IP)",
    timestamp: new Date().toLocaleTimeString()
  });
  const [manualLocationForm, setManualLocationForm] = useState({
    state: "",
    district: "",
    block: "",
    gp: "",
    village: "",
    pincode: ""
  });

  // Location Permission Prompt State
  const [isLocationPermissionModalOpen, setIsLocationPermissionModalOpen] = useState(() => {
    return !localStorage.getItem('lok_swar_location_permission_decided');
  });
  const [isDetectingLocation, setIsDetectingLocation] = useState(false);
  const [locationAlertToast, setLocationAlertToast] = useState(null);
  const showToast = (msg, duration = 4000) => {
    setLocationAlertToast(msg);
    setTimeout(() => setLocationAlertToast(null), duration);
  };


  // Pre-load natural speech voices on browser startup
  useEffect(() => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }
  }, []);
  const [bgImage] = useState(() => {
    try {
      const lastIdx = parseInt(localStorage.getItem('lok_swar_bg_idx') || '-1', 10);
      const nextIdx = (lastIdx + 1) % CIVIC_BACKGROUNDS.length;
      localStorage.setItem('lok_swar_bg_idx', nextIdx.toString());
      return CIVIC_BACKGROUNDS[nextIdx];
    } catch (e) {
      return CIVIC_BACKGROUNDS[Math.floor(Math.random() * CIVIC_BACKGROUNDS.length)];
    }
  });
  const [selectedLang, setSelectedLang] = useState(() => {
    try {
      return localStorage.getItem('lok_swar_selected_language') || 'hi';
    } catch (e) {
      return 'hi';
    }
  });
  const handleLanguageChange = newLang => {
    setSelectedLang(newLang);
    try {
      localStorage.setItem('lok_swar_selected_language', newLang);
      window.dispatchEvent(new Event('storage'));
    } catch (e) {}
    playChime('tap');
  };
  useEffect(() => {
    const onStorage = e => {
      const val = e && e.key === 'lok_swar_selected_language' && e.newValue || localStorage.getItem('lok_swar_selected_language') || 'hi';
      setSelectedLang(val);
    };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, []);
  const [isDarkMode, setIsDarkMode] = useState(() => {
    try {
      return localStorage.getItem('lok_swar_theme_mode') === 'dark';
    } catch (e) {
      return false;
    }
  });
  useEffect(() => {
    if (isDarkMode) {
      document.documentElement.classList.add('dark');
      document.body.classList.add('dark');
      document.body.style.backgroundColor = '#090d16';
      document.body.style.color = '#f8fafc';
    } else {
      document.documentElement.classList.remove('dark');
      document.body.classList.remove('dark');
      document.body.style.backgroundColor = '#f8fafc';
      document.body.style.color = '#0f172a';
    }
  }, [isDarkMode]);
  const toggleDarkMode = () => {
    setIsDarkMode(prev => {
      const next = !prev;
      try {
        localStorage.setItem('lok_swar_theme_mode', next ? 'dark' : 'light');
      } catch (e) {}
      return next;
    });
  };
  const normalizeView = v => {
    if (!v || v === 'home' || v === 'citizen_home' || v === '#') return 'citizen';
    return v;
  };
  const [currentView, setCurrentView] = useState(() => {
    const hash = window.location.hash.replace('#/', '').replace('#', '') || 'citizen';
    return normalizeView(hash);
  });
  useEffect(() => {
    const handlePopState = () => {
      const hash = window.location.hash.replace('#/', '').replace('#', '') || 'citizen';
      setCurrentView(normalizeView(hash));
    };
    window.addEventListener('popstate', handlePopState);
    window.addEventListener('hashchange', handlePopState);
    return () => {
      window.removeEventListener('popstate', handlePopState);
      window.removeEventListener('hashchange', handlePopState);
    };
  }, []);
  const navigateView = viewName => {
    const target = normalizeView(viewName);
    setCurrentView(target);
    window.history.pushState({
      view: target
    }, '', `#/${target}`);
    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  };

  // Notifications & Drawers State
  const [isDrawerOpen, setIsDrawerOpen] = useState(false);
  const [isNotifOpen, setIsNotifOpen] = useState(false);
  const [notifications, setNotifications] = useState(INITIAL_NOTIFICATIONS);
  const [inputText, setInputText] = useState('');
  const inputTextRef = useRef(inputText);
  useEffect(() => { inputTextRef.current = inputText; }, [inputText]);
  const translationSeqRef = useRef(0);
  const [realtimeTranslation, setRealtimeTranslation] = useState('');
  const [originalRegionalText, setOriginalRegionalText] = useState('');
  const [inputDetectedLang, setInputDetectedLang] = useState('');
  const [hasAutoTranslated, setHasAutoTranslated] = useState(false);
  const [isTranslatingRealtime, setIsTranslatingRealtime] = useState(false);
  const translateDebounceTimeoutRef = useRef(null);
  const [userLocation, setUserLocation] = useState(() => {
    try {
      const saved = localStorage.getItem('lok_swar_user_gps');
      return saved ? JSON.parse(saved) : {
        lat: 28.6139,
        lng: 77.2090
      };
    } catch (e) {
      return {
        lat: 28.6139,
        lng: 77.2090
      };
    }
  });
  const [radarRadius, setRadarRadius] = useState(10); // Radius in km (2, 5, 10, 50)
  const [isRecording, setIsRecording] = useState(false);
  const [audioVolumeLevel, setAudioVolumeLevel] = useState(0);
  const [voiceWaveform, setVoiceWaveform] = useState(() => Array(24).fill(4));
  const waveformAnimFrameRef = useRef(null);
  const [isSilenceDetected, setIsSilenceDetected] = useState(false);
  const [silenceProgress, setSilenceProgress] = useState(0);
  const silenceTimeoutRef = useRef(null);
  const [recordingTimer, setRecordingTimer] = useState(0);
  const [liveSpokenText, setLiveSpokenText] = useState('');
  const [isTranslatingVoice, setIsTranslatingVoice] = useState(false);
  const [voiceMeta, setVoiceMeta] = useState(null);
  const [isTypingAnim, setIsTypingAnim] = useState(false);
  const [recordedAudioBase64, setRecordedAudioBase64] = useState(null);
  const [photoPreview, setPhotoPreview] = useState(null);
  const [isSubmittingAnim, setIsSubmittingAnim] = useState(false);
  const [submitSuccess, setSubmitSuccess] = useState(false);
  const [isSubmittedButton, setIsSubmittedButton] = useState(false);
  const [lastSubmittedTicket, setLastSubmittedTicket] = useState(null);
  const [isSpeaking, setIsSpeaking] = useState(false);
  const [ttsPopupMessage, setTtsPopupMessage] = useState(null);
  const [isVoiceGuideActive, setIsVoiceGuideActive] = useState(() => {
    try {
      const stored = localStorage.getItem('lok_swar_voice_guide_active');
      return stored === null ? true : stored === 'true';
    } catch (e) {
      return true;
    }
  });
  const isVoiceGuideActiveRef = useRef(isVoiceGuideActive);
  useEffect(() => {
    isVoiceGuideActiveRef.current = isVoiceGuideActive;
  }, [isVoiceGuideActive]);
  const lastSpokenRef = useRef({ key: '', time: 0 });
  const [expandedProblemId, setExpandedProblemId] = useState(null);

  // Haversine GPS Distance Helper Calculation (KM)
  const parseGpsCoords = gpsStr => {
    if (!gpsStr) return { lat: 22.1245, lng: 84.0321 };
    if (typeof gpsStr === 'object') {
      const lat = parseFloat(gpsStr.lat || gpsStr.latitude);
      const lng = parseFloat(gpsStr.lng || gpsStr.longitude);
      if (!isNaN(lat) && !isNaN(lng)) return { lat, lng };
      return { lat: 22.1245, lng: 84.0321 };
    }
    const cleanStr = String(gpsStr).replace(/°/g, '').replace(/[NSnsEWew]/g, ' ');
    const matches = cleanStr.match(/([-+]?[\d.]+)[^\d+-]+([-+]?[\d.]+)/);
    if (matches) {
      const lat = parseFloat(matches[1]);
      const lng = parseFloat(matches[2]);
      if (!isNaN(lat) && !isNaN(lng)) return { lat, lng };
    }
    return { lat: 22.1245, lng: 84.0321 };
  };
  const getDistanceKm = (loc1, loc2) => {
    if (!loc1 || !loc2) return 0.5;
    const R = 6371;
    const dLat = (loc2.lat - loc1.lat) * Math.PI / 180;
    const dLng = (loc2.lng - loc1.lng) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(loc1.lat * Math.PI / 180) * Math.cos(loc2.lat * Math.PI / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return parseFloat((R * c).toFixed(2));
  };

  const activeAudioElementRef = useRef(null);
  const voiceSessionCounterRef = useRef(0);
  const lastSpeechTimeRef = useRef(0);

  // Mute helper: completely stops all voice guidance (both Web Speech and server audio)
  const muteAllSpeech = () => {
    voiceSessionCounterRef.current++;
    if ('speechSynthesis' in window) {
      try {
        window.speechSynthesis.cancel();
      } catch (e) {}
    }
    if (activeAudioElementRef.current) {
      try {
        activeAudioElementRef.current.pause();
        activeAudioElementRef.current.currentTime = 0;
        activeAudioElementRef.current.onended = null;
        activeAudioElementRef.current.onerror = null;
        activeAudioElementRef.current.src = '';
      } catch (e) {}
      activeAudioElementRef.current = null;
    }
    setIsSpeaking(false);
    setTtsPopupMessage(null);
  };

  // Voice Engine Dictionary loaded via js/citizen/voice_engine.js
  const GUIDANCE_DICTIONARY = window.GUIDANCE_DICTIONARY;

  // Native Speech Synthesis Engine loaded via js/citizen/voice_engine.js
  const fallbackBrowserSpeech = window.fallbackBrowserSpeech;

  // High-Precision Voice Guidance Engine: Plays exactly ONE audio stream in ONE target language
  const speakGuidance = (key = 'welcome', customText = null, overrideLang = null) => {
    if (isRecordingRef.current) return;
    if (!isVoiceGuideActiveRef.current && key !== 'voice_toggle_on') {
      muteAllSpeech();
      return;
    }

    const now = Date.now();
    // Debounce rapid triggering (at least 650ms between spoken instructions)
    if (now - lastSpeechTimeRef.current < 650) {
      return;
    }
    lastSpeechTimeRef.current = now;

    // Cancel any current speech completely before starting new one
    muteAllSpeech();

    const thisSession = ++voiceSessionCounterRef.current;
    const currentLang = overrideLang || selectedLang || 'hi';
    const langEntry = (key && GUIDANCE_DICTIONARY && GUIDANCE_DICTIONARY[key] && (GUIDANCE_DICTIONARY[key][currentLang] || GUIDANCE_DICTIONARY[key].hi || GUIDANCE_DICTIONARY[key].en)) || {};
    const displayText = customText || langEntry.display || (window.CITIZEN_I18N?.[currentLang]?.brandTitle ? `${window.CITIZEN_I18N[currentLang].brandTitle} Voice Guide` : "Lok Swar Voice Assistant");
    const spokenText = customText || langEntry.spoken || displayText;
    const enSub = langEntry.enSub || "";

    setTtsPopupMessage({
      text: displayText,
      display: displayText,
      spoken: spokenText,
      enSub: enSub,
      lang: currentLang.toUpperCase()
    });
    setIsSpeaking(true);

    const onSpeechEnd = () => {
      if (voiceSessionCounterRef.current !== thisSession) return;
      setIsSpeaking(false);
      activeAudioElementRef.current = null;
      setTimeout(() => {
        if (voiceSessionCounterRef.current === thisSession) {
          setTtsPopupMessage(prev => (prev && prev.display === displayText ? null : prev));
        }
      }, 1500);
    };

    // Primary High-Precision Female Neural Voice Stream via /api/tts (Edge Neural & Google Female TTS)
    // Plays cleanly with 100% native pronunciation in the exact target language.
    // NEVER overlaps with browser speech synthesis.
    try {
      const ttsAudio = new Audio(`/api/tts?text=${encodeURIComponent(spokenText)}&lang=${encodeURIComponent(currentLang)}`);
      activeAudioElementRef.current = ttsAudio;

      ttsAudio.onended = () => {
        if (voiceSessionCounterRef.current !== thisSession) return;
        onSpeechEnd();
      };

      ttsAudio.onerror = () => {
        if (voiceSessionCounterRef.current !== thisSession) return;
        if (activeAudioElementRef.current === ttsAudio) {
          activeAudioElementRef.current = null;
        }
        // Last-resort fallback: only if server audio failed
        fallbackBrowserSpeech(spokenText, currentLang, onSpeechEnd, () => {
          if (voiceSessionCounterRef.current === thisSession) setIsSpeaking(false);
        });
      };

      const playPromise = ttsAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch((err) => {
          if (voiceSessionCounterRef.current !== thisSession) return;
          try {
            ttsAudio.pause();
            ttsAudio.src = '';
          } catch(e) {}
          if (activeAudioElementRef.current === ttsAudio) {
            activeAudioElementRef.current = null;
          }
          fallbackBrowserSpeech(spokenText, currentLang, onSpeechEnd, () => {
            if (voiceSessionCounterRef.current === thisSession) setIsSpeaking(false);
          });
        });
      }
    } catch (e) {
      if (voiceSessionCounterRef.current === thisSession) {
        fallbackBrowserSpeech(spokenText, currentLang, onSpeechEnd, () => {
          if (voiceSessionCounterRef.current === thisSession) setIsSpeaking(false);
        });
      }
    }
  };


  // Toggle Voice Assistant Guidance Mode
  const toggleVoiceGuide = () => {
    playChime('tap');
    setIsVoiceGuideActive(prev => {
      const next = !prev;
      try {
        localStorage.setItem('lok_swar_voice_guide_active', next ? 'true' : 'false');
      } catch (e) {}
      if (next) {

      const allVariants = [entity.en, entity.or, entity.hi, entity.bn, entity.bho].filter(Boolean);

    if (navigator.geolocation) {
      try {
        const timeoutMs = interactive ? 15000 : 8000;
        coords = await new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error("GPS timeout")), timeoutMs);
          navigator.geolocation.getCurrentPosition(
            pos => {
              clearTimeout(timer);
              resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
            },
            err => {
              clearTimeout(timer);
              reject(err);
            },
            { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 0 }
          );
        });
      } catch (err) {
        console.warn("Browser GPS unavailable or timed out, falling back to network IP location:", err);
      }
    }

    // 2. Fallback to server/network IP location if GPS not available or denied
    if (!coords) {

      "toot", "khambha", "khamba", "gaya", "hai", "nahi", "nhi", "raha", "chapakal", "gaddha",

      try {

          "Odia": "or", "Bengali": "bn", "Tamil": "ta", "Telugu": "te",

        const gUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${slCode}&tl=en&dt=t&q=${encodeURIComponent(clean)}`;

      if (seq !== translationSeqRef.current) return;

      const fullText = `${prob.title || ''} ${prob.titleOriginal || ''} ${prob.directEnglishTranslation || ''} ${prob.adminEnglishTranslation || ''} ${cat}`.toLowerCase();

      // Survival / Natural Disaster Criteria:
      // Floods, collapsed bridges, cut-off roads, high-voltage live wire hazards, drinking water contamination
      const isSurvivalDisaster = fullText.includes('flood') || fullText.includes('बाढ़') || fullText.includes('ବାତ୍ୟା') || fullText.includes('जलभराव') || fullText.includes('inundat') || fullText.includes('collapse') || fullText.includes('washout') || fullText.includes('cut-off') || fullText.includes('cut off') || fullText.includes('bridge') || fullText.includes('pul') || fullText.includes('पुल') || fullText.includes('पुलवा') || fullText.includes('ସେତୁ') || fullText.includes('disaster') || fullText.includes('hazard') || fullText.includes('emergency') || fullText.includes('33kv') || fullText.includes('transformer') || fullText.includes('live wire') || fullText.includes('current') || fullText.includes('antivenom') || fullText.includes('hospital') || fullText.includes('ambulance') || fullText.includes('scarcity') || fullText.includes('crisis') || fullText.includes('contamination');

  const encodeWAV = (samples, sampleRate = 16000) => {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);
    const writeStr = (v, offset, str) => {
      for (let i = 0; i < str.length; i++) v.setUint8(offset + i, str.charCodeAt(i));
    };
    writeStr(view, 0, 'RIFF');
    view.setUint32(4, 36 + samples.length * 2, true);
    writeStr(view, 8, 'WAVE');
    writeStr(view, 12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); // PCM format
    view.setUint16(22, 1, true); // Mono
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeStr(view, 36, 'data');
    view.setUint32(40, samples.length * 2, true);
    let offset = 44;
    for (let i = 0; i < samples.length; i++, offset += 2) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return new Blob([view], {
      type: 'audio/wav'
    });
  };
  const downsampleBuffer = (buffer, inRate, outRate = 16000) => {
    if (inRate === outRate) return buffer;
    const ratio = inRate / outRate;
    const newLen = Math.round(buffer.length / ratio);
    const result = new Float32Array(newLen);
    let offsetResult = 0;
    let offsetBuffer = 0;
    while (offsetResult < result.length) {
      const nextOffset = Math.round((offsetResult + 1) * ratio);
      let accum = 0,
        count = 0;
      for (let i = offsetBuffer; i < nextOffset && i < buffer.length; i++) {
        accum += buffer[i];
        count++;
      }
      result[offsetResult] = count > 0 ? accum / count : 0;
      offsetResult++;
      offsetBuffer = nextOffset;
    }
    return result;
  };
