                    <div className="flex gap-2.5 pt-2">
                      <button type="button" onClick={() => { playChime('tap'); setIsDroneModalOpen(false); }} className="flex-1 py-3 rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-bold text-xs cursor-pointer active:scale-95 transition-all shadow-xs">Cancel</button>
                      <button type="submit" className="flex-1 py-3 rounded-2xl bg-slate-900 dark:bg-slate-100 hover:bg-slate-800 dark:hover:bg-slate-200 text-white dark:text-slate-900 font-bold text-xs cursor-pointer active:scale-95 transition-all shadow-md">Launch UAV Flight</button>
                    </div>
                  </form>
                ) : (
                  <div className="py-8 text-center space-y-4">
                    <div className="flex items-center justify-center gap-2 text-sm font-bold text-slate-900 dark:text-slate-100">
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                      <span>UAV In-Flight Telemetry Active ({droneTelemetryProgress}%)</span>
                    </div>
                    <div className="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
                      <div className="h-full bg-slate-900 dark:bg-slate-100 transition-all duration-150" style={{ width: `${droneTelemetryProgress}%` }} />
                    </div>
                    <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">Transmitting real-time orthomosaic elevation models to district ledger...</p>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* OFFICIAL BROADCAST MODAL */}
          {isBroadcastModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="w-full max-w-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-2xl space-y-4 text-left text-slate-900 dark:text-slate-100">
                <h3 className="text-base font-black text-slate-900 dark:text-white flex items-center gap-2">
                  <span>📢</span> Dispatch Official District Announcement
                </h3>
                <form onSubmit={handleSendBroadcast} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Target Gram Panchayats</label>
                    <select value={broadcastGP} onChange={(e) => setBroadcastGP(e.target.value)} className="w-full p-3 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-xs font-bold outline-none">
                      <option value="All Gram Panchayats">All 142 Gram Panchayats (Constituency-Wide)</option>
                      <option value="Kalyanpur Gram Panchayat">Kalyanpur Gram Panchayat (Flood Zone)</option>
                      <option value="Jhirpani Tribal Hamlet">Jhirpani Tribal Hamlet (Water Zone)</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Announcement Title</label>
                    <input type="text" value={broadcastTitle} onChange={(e) => setBroadcastTitle(e.target.value)} placeholder="e.g. Emergency Pontoon Bridge Construction Started" className="w-full p-3 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-xs font-bold outline-none" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Detailed Message for Citizen Feeds</label>
                    <textarea rows="3" value={broadcastMessage} onChange={(e) => setBroadcastMessage(e.target.value)} placeholder="Enter details for citizens..." className="w-full p-3 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-xs font-bold outline-none" />
                  </div>
                  <div className="flex gap-2.5 pt-2">
                    <button type="button" onClick={() => { playChime('tap'); setIsBroadcastModalOpen(false); }} className="flex-1 py-3 rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-bold text-xs cursor-pointer active:scale-95 transition-all shadow-xs">Cancel</button>
                    <button type="submit" className="flex-1 py-3 rounded-2xl bg-slate-900 dark:bg-slate-100 hover:bg-slate-800 dark:hover:bg-slate-200 text-white dark:text-slate-900 font-bold text-xs cursor-pointer active:scale-95 transition-all shadow-md">Dispatch Broadcast</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<AdminSoftwareSuite />, document.getElementById('root'));
  </script>
</body>
</html>
