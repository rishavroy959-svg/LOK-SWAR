    const DEFAULT_WEIGHTS = {
      affected_population: 0.15,
      baseline_infrastructure_gap: 0.12,
      social_vulnerability_index: 0.12,
      travel_distance_reduction: 0.10,
      education_enrolment_impact: 0.10,
      urgency_disaster_risk: 0.08,
      cost_efficiency_benefit_cr: 0.08,
      multi_sensor_corroboration: 0.06,
      community_consensus_recurrence: 0.06,
      statutory_gram_sabha_alignment: 0.05,
      predictive_economic_bcr: 0.05,
      direct_employment_mandays: 0.03
    };

    function calculateMautScore(project, weights) {
      const w = { ...DEFAULT_WEIGHTS, ...(weights || {}) };
      const factors = {
        affected_population: Math.min(100, Math.round((project.expected_population_benefited / 20000) * 100)),
        baseline_infrastructure_gap: project.infrastructure_gap_score || 80,
        social_vulnerability_index: project.social_impact_score || 85,
        travel_distance_reduction: project.accessibility_gap_score || 75,
        education_enrolment_impact: project.category === 'Education & Schools' ? 95 : (project.demand_score || 70),
        urgency_disaster_risk: project.severity_score || 80,
        cost_efficiency_benefit_cr: Math.min(100, Math.round(((project.expected_population_benefited / Math.max(0.1, project.estimated_cost_cr)) / 6000) * 100)),
        multi_sensor_corroboration: project.evidence_confidence || 90,
        community_consensus_recurrence: project.demand_score || 85,
        statutory_gram_sabha_alignment: project.feasibility_score || 85,
        predictive_economic_bcr: Math.min(100, Math.round(((project.predictive_impact ? project.predictive_impact.benefit_cost_ratio : 2.5) / 4.0) * 100)),
        direct_employment_mandays: Math.min(100, Math.round(((project.predictive_impact ? project.predictive_impact.local_mandays_created : 5000) / 18000) * 100))
      };
      let score = 0;
      let totalW = 0;
      for (const [k, val] of Object.entries(factors)) {
        const weight = w[k] !== undefined ? w[k] : 0.05;
        score += val * weight;
        totalW += weight;
      }
      return {
        totalScore: Math.round((score / (totalW || 1)) * 10) / 10,
        factors: factors
      };
    }

    function solveMilpKnapsack(projects, budgetCr = 10.0, weights = null, minRural = 2) {
      const scored = projects.map(p => {
        const { totalScore, factors } = calculateMautScore(p, weights);
        const bPerCr = Math.round((p.expected_population_benefited / Math.max(0.1, p.estimated_cost_cr)));
        const efficiency = totalScore / Math.max(0.5, p.estimated_cost_cr);
        return {
          ...p,
          priority_score: totalScore,
          score_factors: factors,
          benefit_per_cr: bPerCr,
          efficiency: efficiency,
          is_rural: (p.area_type || '').toLowerCase().includes('rural')
        };
      });

      // Knapsack with guaranteed rural equity
      const rural = scored.filter(p => p.is_rural).sort((a, b) => b.efficiency - a.efficiency);
      const selectedIds = new Set();
      let used = 0;

      // 1. Ensure minimum rural statutory quota
      for (const rp of rural.slice(0, minRural)) {
        if (used + rp.estimated_cost_cr <= budgetCr) {
          selectedIds.add(rp.id);
          used += rp.estimated_cost_cr;
        }
      }

      // 2. Greedily select remaining highest-efficiency proposals within budget cap
      const remaining = scored.filter(p => !selectedIds.has(p.id)).sort((a, b) => b.efficiency - a.efficiency);
      for (const p of remaining) {
        if (used + p.estimated_cost_cr <= budgetCr + 0.001) {
          selectedIds.add(p.id);
          used += p.estimated_cost_cr;
        }
      }

      const all = scored.map(p => ({ ...p, is_selected: selectedIds.has(p.id) }));
      const selected = all.filter(p => p.is_selected);
      const excluded = all.filter(p => !p.is_selected);

      return {
        budget_allocated_cr: budgetCr,
        budget_utilized_cr: Math.round(used * 100) / 100,
        budget_surplus_cr: Math.round(Math.max(0, budgetCr - used) * 100) / 100,
        selected_count: selected.length,
        total_beneficiaries: selected.reduce((sum, p) => sum + p.expected_population_benefited, 0),
        avg_score: selected.length ? Math.round((selected.reduce((sum, p) => sum + p.priority_score, 0) / selected.length) * 10) / 10 : 0,
        rural_count: selected.filter(p => p.is_rural).length,
        selected_projects: selected,
        excluded_projects: excluded,
        all_projects: all
      };
    }

// Optimization Engine
function calculatePortfolioImpact(project, weights) {
  const w = weights;
  const popScore = Math.min(100, (project.expected_population_benefited / 20000) * 100); 
  const urgScore = project.demand_score || 0;
  const sevScore = project.severity_score || 0;
  const critScore = project.infrastructure_gap_score || 0;
  const outScore = project.social_impact_score || 0;
  
  const finalScore = (popScore * w.population + urgScore * w.urgency + sevScore * w.severity + critScore * w.criticality + outScore * w.outcome) / 100;
  
  return {
    score: Math.round(finalScore * 10) / 10,
    factors: { popScore, urgScore, sevScore, critScore, outScore }
  };
}

function optimizePortfolio(projects, budgetCr, weights, constraints, budgetUnitCr = 0.01) {
  const maxW = Math.floor(budgetCr / budgetUnitCr);
  
  let scored = projects.map(p => {
    const impact = calculatePortfolioImpact(p, weights);
    return {
      ...p,
      impact: impact.score,
      costUnits: Math.ceil((p.estimated_cost_cr || 0) / budgetUnitCr),
      isEligible: constraints.eligibility[p.id] !== false,
      isMandatory: !!constraints.mandatory[p.id],
      exclusionGroup: constraints.exclusions[p.id] || null,
      dependsOn: constraints.dependencies[p.id] || null
    };
  });
  
  // Filter eligible
  scored = scored.filter(p => p.isEligible && p.costUnits > 0);
  
  let remainingW = maxW;
  const selectedMandatory = new Set();
  const mandatoryProjects = scored.filter(p => p.isMandatory);
  
  for (const mp of mandatoryProjects) {
    if (remainingW >= mp.costUnits) {
      selectedMandatory.add(mp.id);
      remainingW -= mp.costUnits;
    } else {
      return { error: "Budget is insufficient for all mandatory projects." };
    }
  }
  
  let optional = scored.filter(p => !p.isMandatory);
  
  // Topological sort for dependencies
  // A simple hack since it's 1 level deep: put dependencies first
  optional.sort((a, b) => {
    if (a.dependsOn === b.id) return 1;
    if (b.dependsOn === a.id) return -1;
    return 0;
  });

  const groups = {};
  let autoGroupId = 1;
  optional.forEach(p => {
    let g = p.exclusionGroup;
    if (!g) g = 'auto_' + autoGroupId++;
    if (!groups[g]) groups[g] = [];
    groups[g].push(p);
  });
  
  const dp = new Array(remainingW + 1);
  for (let w = 0; w <= remainingW; w++) dp[w] = { value: 0, items: [] };
  
  const groupKeys = Object.keys(groups);
  
  for (let i = 0; i < groupKeys.length; i++) {
    const group = groups[groupKeys[i]];
    for (let w = remainingW; w >= 0; w--) {
      let bestVal = dp[w].value;
      let bestItems = dp[w].items;
      
      for (const item of group) {
        if (w >= item.costUnits) {
          const prev = dp[w - item.costUnits];
          
          let canPick = true;
          if (item.dependsOn) {
             const depId = item.dependsOn;
             if (!selectedMandatory.has(depId) && !prev.items.includes(depId)) {
                canPick = false;
             }
          }
          
          if (canPick) {
             const newVal = prev.value + item.impact;
             if (newVal > bestVal || (newVal === bestVal && newVal > 0 && item.costUnits < (bestItems.length ? bestItems[bestItems.length-1].costUnits : Infinity))) {
                bestVal = newVal;
                bestItems = [...prev.items, item.id];
             }
          }
        }
      }
      dp[w] = { value: bestVal, items: bestItems };
    }
  }
  
  let bestW = 0;
  for (let w = 0; w <= remainingW; w++) {
    if (dp[w].value > dp[bestW].value) bestW = w;
  }
  
  const finalOptionalIds = new Set(dp[bestW].items);
  const allSelectedIds = new Set([...selectedMandatory, ...finalOptionalIds]);
  
  const selectedProjects = scored.filter(p => allSelectedIds.has(p.id));
  const unselectedProjects = scored.filter(p => !allSelectedIds.has(p.id));
  
  const totalCostCr = selectedProjects.reduce((sum, p) => sum + (p.estimated_cost_cr || 0), 0);
  const totalImpact = selectedProjects.reduce((sum, p) => sum + p.impact, 0);
  
  unselectedProjects.forEach(p => {
    if (!p.isEligible) p.excludeReason = "Marked as ineligible by administrator.";
    else if (p.dependsOn && !allSelectedIds.has(p.dependsOn)) p.excludeReason = "Required project dependency was not met.";
    else if (p.costUnits > remainingW) p.excludeReason = "Exceeds remaining budget cap.";
    else if (p.exclusionGroup && selectedProjects.some(sp => sp.exclusionGroup === p.exclusionGroup)) p.excludeReason = "Mutually exclusive with another selected project.";
    else p.excludeReason = "Optimized out: lower mathematical utility than chosen frontier.";
  });
  
  return {
    selectedProjects,
    unselectedProjects,
    totalCostCr,
    remainingBudgetCr: budgetCr - totalCostCr,
    totalImpact,
    budgetCr,
    weights
  };
}
