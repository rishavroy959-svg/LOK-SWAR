    return (\n          <div className=\"min-h-screen w-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950 text-white\">\n            <div className=\"w-full max-w-lg rounded-3xl p-8 shadow-2xl space-y-6 text-left border-2 bg-slate-900 border-slate-800 text-white\">\n              <div className=\"flex items-center gap-3.5 pb-5 border-b border-slate-800\">\n                <div className=\"w-14 h-14 rounded-2xl bg-emerald-600 text-white text-3xl font-black flex items-center justify-center shadow-lg\">\n                  \ud83d\udde3\ufe0f\n                </div>\n                <div>\n                  <span className=\"text-[10px] font-black px-2.5 py-0.5 rounded-full border uppercase bg-emerald-600/30 text-emerald-400 border-emerald-500/40\">\n                    \u0928\u093e\u0917\u0930\u093f\u0915 \u092a\u094b\u0930\u094d\u091f\u0932 \u2022 Citizen Gateway\n                  </span>\n                  <h1 className=\"text-2xl font-black mt-1 text-white\">\u0932\u094b\u0915 \u0938\u094d\u0935\u0930 (Lok Swar)</h1>\n                  <p className=\"text-xs font-semibold text-slate-400\">AC-134 Sundargarh \u2022 142 Gram Panchayats</p>\n                </div>\n              </div>\n\n              {loginError && <div className=\"p-3 rounded-2xl bg-red-500/20 text-red-300 text-xs font-bold\">\u26a0\ufe0f {loginError}</div>}\n\n              {!otpSent ? (\n                <form onSubmit={handleSendMobileOtp} className=\"space-y-4\">\n                  <div>\n                    <label className=\"block text-xs font-black uppercase mb-1.5 text-slate-300\">\n                      \ud83d\udcf1 10-\u0905\u0902\u0915\u094b\u0902 \u0915\u093e \u092e\u094b\u092c\u093e\u0907\u0932 \u0928\u0902\u092c\u0930 (Mobile Number)\n                    </label>\n                    <div className=\"flex items-center rounded-2xl border-2 p-1 pl-3.5 bg-slate-950 border-slate-700\">\n                      <span className=\"text-sm font-bold text-slate-500 font-mono-code\">+91</span>\n                      <input\n                        type=\"text\"\n                        maxLength=\"10\"\n                        value={mobileInput}\n                        onChange={(e) => setMobileInput(e.target.value.replace(/\\D/g, ''))}\n                        className=\"w-full p-2.5 bg-transparent font-black text-base outline-none font-mono-code text-white\"\n                      />\n                    </div>\n                  </div>\n                  <button type=\"submit\" className=\"w-full py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm shadow-xl cursor-pointer\">\n                    \ud83d\udcf2 OTP \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0915\u0930\u0947\u0902 (Send OTP)\n                  </button>\n                </form>\n              ) : (\n                <form onSubmit={handleVerifyOtp} className=\"space-y-4\">\n                  <div>\n                    <label className=\"block text-xs font-black uppercase mb-1.5 text-slate-300\">\n                      \ud83d\udd11 6-\u0905\u0902\u0915\u094b\u0902 \u0915\u093e OTP \u0926\u0930\u094d\u091c \u0915\u0930\u0947\u0902 (Enter 6-Digit OTP)\n                    </label>\n                    <input\n                      type=\"text\"\n                      maxLength=\"6\"\n                      value={otpInput}\n                      onChange={(e) => setOtpInput(e.target.value)}\n                      placeholder=\"123456\"\n                      className=\"w-full p-3.5 rounded-2xl border-2 font-black text-xl text-center tracking-widest outline-none font-mono-code bg-slate-950 border-slate-700 text-white\"\n                    />\n                  </div>\n                  <button type=\"submit\" className=\"w-full py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm shadow-xl cursor-pointer\">\n                    \u2713 \u0938\u0924\u094d\u092f\u093e\u092a\u093f\u0924 \u0915\u0930\u0947\u0902 \u0935 \u092a\u094d\u0930\u0935\u0947\u0936 \u0915\u0930\u0947\u0902 (Verify & Sign In)\n                  </button>\n                </form>\n              )}\n\n              <div className=\"pt-4 border-t border-slate-800 space-y-3\">\n                <div className=\"text-xs font-black uppercase text-slate-400\">\u26a1 Instant Mobile Auto-Fill for Testing:</div>\n                <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-2.5\">\n                  <button\n                    onClick={() => { setMobileInput(\"9861234567\"); setLoginError(null); }}\n                    className=\"p-3 rounded-2xl border-2 text-left flex items-center gap-2.5 cursor-pointer bg-slate-950 border-slate-800 hover:border-emerald-500 transition-all\"\n                  >\n                    <span className=\"text-xl\">\ud83d\udcf1</span>\n                    <div className=\"min-w-0 flex-1\">\n                      <div className=\"text-xs font-mono font-bold text-white\">+91-9861234567</div>\n                      <div className=\"text-[10px] text-emerald-400 font-bold\">Use Mobile Number</div>\n                    </div>\n                  </button>\n\n                  <button\n                    onClick={() => { setMobileInput(\"9437123890\"); setLoginError(null); }}\n                    className=\"p-3 rounded-2xl border-2 text-left flex items-center gap-2.5 cursor-pointer bg-slate-950 border-slate-800 hover:border-emerald-500 transition-all\"\n                  >\n                    <span className=\"text-xl\">\ud83d\udcf1</span>\n                    <div className=\"min-w-0 flex-1\">\n                      <div className=\"text-xs font-mono font-bold text-white\">+91-9437123890</div>\n                      <div className=\"text-[10px] text-emerald-400 font-bold\">Use Mobile Number</div>\n                    </div>\n                  </button>\n                </div>\n              </div>\n            </div>\n          </div>\n        );\n      }\n\n      // CITIZEN DASHBOARD (DARK MODE ONLY, SLEEK & VISIBLE)\n      return (\n        <div className=\"min-h-screen w-full relative flex flex-col justify-between select-none font-sans overflow-x-hidden transition-colors duration-200 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 hero-dot-pattern\">\n          \n          {/* DYNAMIC SCENERY BACKGROUND */}\n          <div\n            className=\"fullscreen-bg hidden dark:block\"\n            style={{\n              backgroundImage: `url('${bgImage}')`,\n              filter: 'brightness(0.18) contrast(1.2)'\n            }}\n          />\n          <div className=\"fixed inset-0 z-0 pointer-events-none transition-colors duration-200 bg-slate-50/50 dark:bg-slate-950/90\" />\n\n          {/* ========================================================================= */}\n          {/* 1. GSAP MENU DRAWER (ORIGINATING & SHRINKING FROM TOP-LEFT [\u2630]) */}\n          {/* ========================================================================= */}\n          {isDrawerOpen && (\n            <div className=\"fixed inset-0 z-50 flex\">\n              <div\n                ref={overlayRef}\n                className=\"fixed inset-0 bg-black/60 backdrop-blur-xs\"\n                onClick={closeDrawerWithAnimation}\n              />\n\n              <div\n                ref={drawerRef}\n                className=\"relative w-96 max-w-[88vw] h-full flex flex-col justify-between shadow-2xl z-10 border-r transition-colors duration-200 bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-900 dark:text-slate-100\"\n              >\n                {/* DRAWER HEADER */}\n                <div className=\"p-5 border-b flex items-center justify-between bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800\">\n                  <div className=\"flex items-center gap-3\">\n                    <div className=\"w-11 h-11 rounded-2xl flex items-center justify-center text-xl font-bold bg-emerald-600 text-white shadow-sm border border-emerald-500/40\">\n                      \ud83c\udfdb\ufe0f\n                    </div>\n                    <div>\n                      <h3 className=\"font-black text-base text-slate-900 dark:text-white\">{t.drawerTitle}</h3>\n                      <div className=\"flex items-center gap-2 mt-0.5\">\n                        <span className=\"text-[10px] font-black px-2 py-0.5 rounded-full border bg-slate-100 dark:bg-slate-900 text-slate-700 dark:text-slate-300 border-slate-300 dark:border-slate-700\">\n                          {t.constituencyTag}\n                        </span>\n                      </div>\n                    </div>\n                  </div>\n                  <button onClick={closeDrawerWithAnimation} className=\"p-2 text-lg font-bold text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 cursor-pointer\">\u2715</button>\n                </div>\n\n                {/* DRAWER BODY / ITEMS */}\n                <div className=\"flex-1 overflow-y-auto p-4 space-y-2.5\">\n\n\n                  <div className=\"text-[11px] font-black uppercase tracking-wider px-1 mb-1 mt-2 text-slate-500 dark:text-slate-400\">\n                    {t.navSectionTitle}\n                  </div>\n\n                  {drawerTabs.map((tab) => {\n                    const isSelected = currentView === tab.id;\n                    return (\n                      <div\n                        key={tab.id}\n                        onClick={() => {\n                          playChime('tap');\n                          navigateView(tab.id);\n                          closeDrawerWithAnimation();\n                        }}\n                        className={`w-full flex items-start gap-3.5 p-3.5 rounded-2xl border text-left cursor-pointer transition-all active:scale-95 shadow-xs ${\n                          isSelected\n                            ? 'bg-emerald-50/90 dark:bg-emerald-950/50 text-emerald-950 dark:text-emerald-100 border-emerald-300 dark:border-emerald-700/60 ring-2 ring-emerald-500/20 shadow-xs'\n                            : 'bg-slate-50/70 dark:bg-slate-950/60 border-slate-200/80 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 hover:bg-slate-100/80 dark:hover:bg-slate-900 text-slate-800 dark:text-slate-200'\n                        }`}\n                      >\n                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-xl flex-shrink-0 font-bold border transition-colors ${\n                          isSelected\n                            ? 'bg-emerald-600 text-white border-emerald-600 shadow-xs'\n                            : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-800'\n                        }`}>\n                          {tab.icon}\n                        </div>\n\n                        <div className=\"flex-1 min-w-0\">\n                          <div className=\"flex items-center justify-between gap-1 mb-0.5\">\n                            <h4 className={`font-bold text-sm truncate ${isSelected ? 'text-emerald-950 dark:text-emerald-100' : 'text-slate-900 dark:text-white'}`}>{tab.title}</h4>\n                          </div>\n                          <p className={`text-[11px] font-medium line-clamp-1 ${isSelected ? 'text-emerald-800 dark:text-emerald-300' : 'text-slate-500 dark:text-slate-400'}`}>{tab.desc}</p>\n                        </div>\n                      </div>\n                    );\n                  })}\n                </div>\n\n                {/* DRAWER FOOTER / CLOSE BUTTON */}\n                <div className=\"p-4 border-t bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800\">\n                  <button\n                    onClick={closeDrawerWithAnimation}\n                    className=\"w-full flex items-center justify-center p-3 rounded-2xl font-bold text-xs bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 cursor-pointer shadow-xs active:scale-95 transition-all border border-slate-300 dark:border-slate-700\"\n                  >\n                    {t.closeMenu}\n                  </button>\n                </div>\n              </div>\n            </div>\n          )}\n\n          {/* ========================================================================= */}\n          {/* 2. GSAP NOTIFICATION FLYOUT (ORIGINATING & SHRINKING FROM TOP-RIGHT [\ud83d\udd14]) */}\n          {/* ========================================================================= */}\n          {isNotifOpen && (\n            <div className=\"fixed inset-0 z-50 flex justify-end\">\n              <div\n                ref={notifOverlayRef}\n                className=\"fixed inset-0 bg-black/60 backdrop-blur-xs\"\n                onClick={closeNotifWithAnimation}\n              />\n\n              <div\n                ref={notifDrawerRef}\n                className=\"relative w-96 max-w-[90vw] h-full flex flex-col justify-between shadow-2xl z-10 border-l transition-colors duration-200 bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-900 dark:text-slate-100\"\n              >\n                {/* HEADER */}\n                <div className=\"p-5 border-b flex items-center justify-between bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800\">\n                  <div className=\"flex items-center gap-2.5\">\n                    <span className=\"text-2xl\">\ud83d\udd14</span>\n                    <div>\n                      <h3 className=\"font-black text-base text-slate-900 dark:text-white\">{t.notifications}</h3>\n                      <div className=\"text-[11px] font-bold text-emerald-600 dark:text-emerald-400\">\n                        {unreadNotifCount} unread update(s)\n                      </div>\n                    </div>\n                  </div>\n                  <div className=\"flex items-center gap-2\">\n                    <button onClick={handleMarkAllRead} className=\"text-[11px] font-bold text-slate-600 dark:text-slate-300 hover:underline cursor-pointer\">\n                      Mark read\n                    </button>\n                    <button onClick={closeNotifWithAnimation} className=\"p-1 text-lg font-bold text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 cursor-pointer\">\u2715</button>\n                  </div>\n                </div>\n\n                {/* NOTIFICATIONS LIST */}\n                <div className=\"flex-1 overflow-y-auto p-4 space-y-3\">\n                  {notifications.map(item => (\n                    <div\n                      key={item.id}\n                      className={`p-3.5 rounded-2xl border transition-all shadow-xs ${\n                        item.isUnread\n                          ? 'bg-slate-100 dark:bg-slate-950 border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white ring-1 ring-slate-300 dark:ring-slate-700'\n                          : 'bg-slate-50 dark:bg-slate-950/70 border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300'\n                      }`}\n                    >\n                      <div className=\"flex items-start gap-2.5\">\n                        <span className=\"text-xl mt-0.5\">{item.icon || \"\ud83d\udd14\"}</span>\n                        <div className=\"flex-1 min-w-0\">\n                          <div className=\"flex justify-between items-center mb-0.5\">\n                            <span className=\"text-xs font-bold text-slate-800 dark:text-slate-200\">{item.tag}</span>\n                            <span className=\"text-[10px] font-medium text-slate-500 dark:text-slate-400\">{item.time}</span>\n                          </div>\n                          <h4 className=\"text-xs font-bold leading-tight mb-1 text-slate-900 dark:text-white\">{item.title}</h4>\n                          <p className=\"text-[11px] leading-relaxed text-slate-600 dark:text-slate-300\">{item.desc}</p>\n                        </div>\n                      </div>\n                    </div>\n                  ))}\n                </div>\n\n                {/* FOOTER */}\n                <div className=\"p-4 border-t bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800\">\n                  <button\n                    onClick={closeNotifWithAnimation}\n                    className=\"w-full flex items-center justify-center p-3.5 rounded-2xl font-bold text-xs bg-slate-900 hover:bg-slate-800 dark:bg-slate-800 dark:hover:bg-slate-700 text-white cursor-pointer shadow-md border border-slate-800 dark:border-slate-700\"\n                  >\n                    \u2713 Close\n                  </button>\n                </div>\n              </div>\n            </div>\n          )}\n\n          {/* 1. NATIONAL TIRANGA STRIP (Government of India / Odisha) */}\n          <div className=\"w-full h-1 bg-gradient-to-r from-amber-500 via-white to-emerald-500 z-50\"></div>\n\n          {/* 2. TOP GOVERNMENT CIVIC UTILITY STRIP */}\n          <div className=\"w-full bg-slate-900 text-slate-200 border-b border-slate-800 text-[11px] px-4 md:px-8 py-1.5 flex items-center justify-between z-40 flex-wrap gap-2\">\n            <div className=\"flex items-center gap-2 font-medium\">\n              <span className=\"text-sm\">\ud83c\uddee\ud83c\uddf3</span>\n              <span className=\"text-white font-bold tracking-wide\">{t.govIndia}</span>\n              <span className=\"text-slate-500 hidden sm:inline\">|</span>\n              <span className=\"text-slate-300 hidden sm:inline\">{t.govState}</span>\n            </div>\n\n            <div className=\"flex items-center gap-3 font-medium flex-wrap\">\n              <span className=\"text-slate-400 hidden md:inline\">\ud83d\udcde {t.helplineNational}</span>\n              <span className=\"text-slate-600 hidden md:inline\">\u2022</span>\n              <span className=\"text-slate-400 hidden lg:inline\">\ud83d\udcde {t.helplineDistrict}</span>\n              <div className=\"flex items-center gap-1.5 bg-slate-800 border border-slate-700 rounded-lg px-2 py-0.5 text-[10px] font-bold text-slate-200\">\n                <span className=\"text-slate-400\">{t.textZoom}</span>\n                <button type=\"button\" onClick={() => document.body.style.fontSize = '90%'} className=\"hover:text-white px-1\">A-</button>\n                <button type=\"button\" onClick={() => document.body.style.fontSize = '100%'} className=\"hover:text-white px-1 font-bold\">A</button>\n                <button type=\"button\" onClick={() => document.body.style.fontSize = '110%'} className=\"hover:text-white px-1 font-bold\">A+</button>\n              </div>\n            </div>\n          </div>\n\n          {/* 3. LOK SWAR TOP CIVIC HEADER */}\n          <header className=\"w-full px-4 md:px-8 py-3 flex items-center justify-between z-30 relative border-b shadow-xs transition-colors duration-200 bg-white/95 dark:bg-slate-900/95 border-slate-200 dark:border-slate-800 backdrop-blur-md text-slate-900 dark:text-white\">\n            {/* Left Brand: LOK SWAR Authentic Logo */}\n            <div className=\"flex items-center gap-3\">\n              <button\n                onClick={() => { playChime('tap'); setIsDrawerOpen(true); }}\n                className=\"min-w-[40px] min-h-[40px] flex items-center justify-center rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 cursor-pointer active:scale-95 transition-all shadow-xs\"\n                title=\"Open Navigation Menu\"\n              >\n                <Icons.Menu className=\"w-5 h-5\" />\n              </button>\n\n              <div className=\"flex items-center gap-2 cursor-pointer select-none\" onClick={() => navigateView('citizen')}>\n                <div class                 <div className=\"flex items-center justify-between text-[11px] text-slate-400 pt-1\">\n                        <span>Official UIDAI Sandbox Code</span>\n                        <button\n                          type=\"button\"\n                          onClick={() => setAadhaarAuthOtpInput(\"123456\")}\n                          className=\"text-blue-400 hover:underline font-semibold cursor-pointer\"\n                        >\n                          Auto-fill Demo (123456)\n                        </button>\n                      </div>\n                    </div>\n                  )}\n\n                  <div className=\"flex gap-2 pt-2\">\n                    <button\n                      type=\"button\"\n                      onClick={() => setIsAadhaarOtpModalOpen(false)}\n                      className=\"flex-1 py-2.5 rounded-xl font-bold text-xs cursor-pointer bg-slate-800 text-slate-300 hover:bg-slate-700\"\n                    >\n                      Cancel\n                    </button>\n                    <button\n                      type=\"button\"\n                      onClick={handleCommitAadhaarOtpVerification}\n                      disabled={isVerifyingAadhaar}\n                      className=\"flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md cursor-pointer flex items-center justify-center gap-1.5\"\n                    >\n                      {isVerifyingAadhaar ? (\n                        <span>Verifying with UIDAI...</span>\n                      ) : (\n                        <span>Verify Aadhaar & Submit</span>\n                      )}\n                    </button>\n                  </div>\n                </div>\n              </div>\n            </div>\n          )}\n\n          <footer className=\"w-full text-center py-3 text-[11px] font-semibold text-slate-400\">\n            Lok Swar \u2022 National Citizen Grievance & Civic Intelligence System \u2022 Sundargarh (AC-134)\n          </footer>\n        </div>\n      );\n    }\n\n    const root = ReactDOM.createRoot(document.getElementById('root'));\n    root.render(<CitizenPortalApp />);\n  ";
