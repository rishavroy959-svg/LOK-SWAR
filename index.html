let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}
function playChime(type = 'tap') {
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    const now = ctx.currentTime;
    if (type === 'tap') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(440, now + 0.06);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.start(now);
      osc.stop(now + 0.06);
    } else if (type === 'success') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.08);
      osc.frequency.setValueAtTime(783.99, now + 0.16);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (type === 'error') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.18);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.start(now);
      osc.stop(now + 0.18);
    }
  } catch (e) {}
}

      return 'en';
    }
  });
  const handleLanguageChange = newLang => {
    setSelectedLang(newLang);
    try {
      localStorage.setItem('lok_swar_selected_language', newLang);
      window.dispatchEvent(new Event('storage'));
    } catch (e) {}
    playChime('tap');
  };
  useEffect(() => {
    const onStorage = e => {
      const val = e && e.key === 'lok_swar_selected_language' && e.newValue || localStorage.getItem('lok_swar_selected_language') || 'en';
      setSelectedLang(val);

    window.addEventListener('storage', onStorage);

          activeAudioRef.current.currentTime = 0;
        } catch (e) {}
        activeAudioRef.current = null;
      }
      setIsSpeaking(false);
      return;
    }
    setIsSpeaking(true);
    const speechText = `${t.title}. ${t.subtitle}.`;
    try {
      const ttsAudio = new Audio(`/api/tts?text=${encodeURIComponent(speechText)}&lang=${encodeURIComponent(selectedLang)}`);
